# Testar este arquivo localmente antes de empurrar -> 'make test-ci' (roda
# este pipeline INTEIRO, do zero, num container Docker via gitlab-ci-local --
# ver o alvo no Makefile e README.md, secao "CI (GitLab)"). E o sucessor de
# 'make check-docs-ubuntu24' (removido, junto com tests/docker/): aquele
# media se o clone limpo + os docs bastavam ate 'make build'/'make install',
# rodando uma copia PARALELA dos comandos do README; este roda o pipeline de
# VERDADE, do mesmo jeito que o runner do GitLab roda, e ainda cobre
# 'make test' -- estritamente mais, nunca menos.

image: ubuntu:24.04

variables:
  DEBIAN_FRONTEND: noninteractive
  # Fora do HOME do container efemero, para caber no 'cache:' abaixo (o
  # runner descarta o resto do filesystem entre jobs -- so CI_PROJECT_DIR e
  # o que 'cache'/'artifacts' sabem preservar).
  CONAN_HOME: "${CI_PROJECT_DIR}/.conan2-cache"
  # Linha do Node que INSTALL.md SS5 fixa ("24 Krypton", a LTS ativa). Aqui
  # como variavel para o dia em que o roteiro mudar de linha: troca-se num
  # lugar so, e o diff mostra a decisao.
  NODE_MAJOR: "24"

stages:
  - build
  - test

cache:
  # Cache 1: pacotes Conan -- o caro de reconstruir (INSTALL.md SS1: o
  # remote publico so tem binario pronto para gcc11, e o gcc13 deste image
  # forca '--build=missing' recompilar boost/protobuf/onnxruntime/mixr do
  # zero). Chave pelo CONTEUDO das receitas: so muda quando uma versao de
  # dependencia muda, nao a cada commit.
  # 'cache:key:files' aceita no maximo DOIS caminhos (limite do proprio
  # GitLab) -- 'conanfile.py' cobre as versoes fixadas (mixr/1.0.5,
  # behaviortree.cpp.asa/3.5.6 inclusive); 'deps/mixr/conanfile.py' cobre o
  # caso de a receita do fork mudar (commit fixado) sem bump de versao ali.
  #
  # 'when: always' (nao o 'on_success' default) -- medido: uma falha de REDE
  # transitoria (DNS do conancenter indisponivel por um instante, alcancavel
  # 6x antes na MESMA execucao) no meio de './scripts/deps.sh' jogava fora
  # HORAS de trabalho ja feito (jsbsim/openrti/mixr/behaviortree ja
  # compilados, cache nunca salvo por o job nao ter "tido sucesso"). Com
  # 'always', a proxima tentativa reaproveita o que ja tinha sido buildado
  # antes da falha -- 'conan create --build=missing' so reconstroi o que
  # ainda nao esta no cache, entao um cache parcial nunca deixa nada
  # inconsistente pra tras, so poupa trabalho.
  #
  # Achado por auditoria, INVESTIGADO E ESCLARECIDO (nao um bug): das 5
  # receitas de deps/ (mixr, behaviortree, jsbsim, openrti, groot), so as
  # duas acima entram nesta CHAVE -- mas isso nao deixa as outras tres
  # desprotegidas. O cache do GitLab aqui guarda ~/.conan2 (CONAN_HOME), que
  # e' o cache de PACOTES do proprio Conan, indexado por HASH da receita --
  # nao pelo conteudo desta chave do GitLab. Se deps/jsbsim/conanfile.py
  # mudar sem a chave mudar, o GitLab restaura o MESMO slot de cache de
  # antes (correto: ele ainda tem os pacotes mixr/behaviortree/openrti/groot
  # validos), e 'conan create --build=missing' sobre a receita do jsbsim
  # MUDADA calcula um hash novo, nao acha correspondencia no cache
  # restaurado, e builda do zero SO o jsbsim -- sem exigir mudanca de chave
  # nenhuma. A chave aqui so precisa cobrir o que decide TROCAR de slot
  # inteiro (as duas fontes de versao fixada), nao cada receita individual.
  - key:
      files:
        - conanfile.py
        - deps/mixr/conanfile.py
    paths:
      - .conan2-cache/
    when: always
  # Cache 2: as arvores de build ja geradas (core + TODOS os modelos --
  # descobertos por padrao de path, sem nome de modelo hardcoded aqui, mesma
  # postura do proprio 'make models'/'find'). Chave por branch: builds
  # incrementais entre pushes da mesma branch: ninja/meson so refazem o que
  # de fato mudou. Mesmo motivo do Cache 1 para 'when: always'.
  #
  # 'models/' NUNCA entra aqui inteiro -- e' arvore de FONTE rastreada
  # (models/players/air/A-4/src, meson.build etc.), so' 'build/'/'dist/' DENTRO
  # dela sao gerados (mesmo padrao do .gitignore raiz). Achado por auditoria
  # (revisao completa do repositorio): o GitLab restaura o cache DEPOIS do
  # checkout do commit, sobrescrevendo arquivo ja presente na working tree --
  # cachear 'models/' inteiro por CHAVE DE BRANCH significa que um push que
  # altera models/players/air/A-4/src/... pode ter esse arquivo revertido, em
  # silencio, para a versao de um pipeline ANTERIOR da mesma branch, antes de
  # 'make models'/'make test-models' rodar. So os subdiretorios GERADOS
  # entram no cache.
  - key: "build-$CI_COMMIT_REF_SLUG"
    paths:
      - build/
      - dist/
      - plugins/
      - models/**/build/
      - models/**/dist/
    when: always

.ambiente:
  before_script:
    - set -euo pipefail
    # -- INSTALL.md SS1: pacotes de sistema ------------------------------
    # EXATAMENTE a lista testada la (Ubuntu 24.04 do zero), mais
    # 'ca-certificates' e sem os recomendados -- ver as divergencias 1 e 2
    # do cabecalho deste arquivo.
    - apt-get update
    - apt-get install -y --no-install-recommends build-essential ninja-build meson pkg-config git curl perl patch zlib1g-dev python3 python3-venv python3-dev pipx gzip sudo ca-certificates
    - rm -rf /var/lib/apt/lists/*
    # -- INSTALL.md SS2: Conan via pipx, nao pip -------------------------
    # Ubuntu 24.04 recusa 'pip install' fora de venv (PEP 668) e nao ha
    # pacote 'conan' no apt. O 'ensurepath' e o passo do roteiro; o 'export'
    # e o que substitui o 'exec "$SHELL"' dele aqui (divergencia 4).
    - pipx install conan
    - pipx ensurepath
    - export PATH="/root/.local/bin:${PATH}"
    - conan --version
    # -- INSTALL.md SS3: perfil default ----------------------------------
    # O Conan 2 nao cria sozinho: sem isto o primeiro 'make configure' morre
    # com "The default build profile doesn't exist".
    - conan profile detect --force
    # SEM remote privado nenhum -- ver o comentario do topo deste arquivo.
    # 'conan remote list' fica como registro no log: o que aparecer aqui e
    # so o conancenter que o proprio Conan ja traz de fabrica.
    - conan remote list
    # -- INSTALL.md SS5: Node.js pelo NodeSource -------------------------
    # 'apt-cache policy nodejs' do roteiro fica implicito: a imagem
    # 'ubuntu:24.04' nem tem o pacote instalado, e o INSTALL.md ja registra
    # que o da distro pode ser velho demais -- por isso o repositorio
    # NodeSource, e nao 'apt install nodejs' puro.
    # MEDIDO num 'ubuntu:24.04' limpo, nao redescobrir: o 'setup_<N>.x' roda
    # o PROPRIO 'apt-get update' e instala sozinho os pre-requisitos que a
    # imagem nao tem ('gnupg', 'apt-transport-https') -- por isso ele
    # funciona logo depois do 'rm -rf' do SS1, sem 'apt-get update' antes, e
    # por isso 'gnupg' nao precisa entrar na lista do SS1. Ja o 'apt install
    # nodejs' seguinte depende das listas que o setup acabou de popular:
    # o 'rm -rf' desta secao vem depois DELE, nunca entre os dois.
    # Medido nesta imagem (2026-09-09): node v24.20.0 traz npm 11.19.0, e o
    # 'npm install -g npm@latest' do roteiro sobe para 12.0.2 -- que declara
    # 'engines' recusando linhas antigas do Node, exatamente o risco que o
    # INSTALL.md SS5 registra ao fixar a linha 24. Se este passo comecar a
    # falhar por 'engines', e sinal de que a linha do NODE_MAJOR saiu de
    # suporte: o conserto e no roteiro, nao aqui.
    - curl -fsSL "https://deb.nodesource.com/setup_${NODE_MAJOR}.x" | sudo -E bash -
    - sudo apt install -y nodejs
    - sudo npm install -g npm@latest
    - rm -rf /var/lib/apt/lists/*
    # -- INSTALL.md SS6: checagem final ----------------------------------
    # Os SETE comandos do roteiro, na mesma ordem -- e o que fecha a
    # instalacao la, e o que fecha o ambiente aqui.
    - gcc --version && meson --version && ninja --version && pkg-config --version && conan --version && node --version && npm --version

build:
  stage: build
  extends: .ambiente
  timeout: 6h
  script:
    - set -euo pipefail
    # -- INSTALL.md SS4: pacotes do Groot + dependencias do fonte --------
    # So este job precisa deles (o 'test' nunca toca 'deps/groot'), entao
    # ficam aqui e nao em '.ambiente'.
    # O 'apt-get update' NAO e redundante com o de '.ambiente': aquele
    # before_script termina cada bloco com 'rm -rf /var/lib/apt/lists/*',
    # entao aqui o indice de pacotes NAO existe mais e este 'apt install'
    # (que numa maquina de usuario roda depois do 'sudo apt update' do SS1)
    # falha com 'E: Unable to locate package cmake' -- e os outros cinco --,
    # sem nenhuma pista da causa. Confirmado rodando via 'make test-ci'.
    - apt-get update
    - sudo apt install -y cmake qtbase5-dev libqt5svg5-dev libzmq3-dev cppzmq-dev libdw-dev
    - rm -rf /var/lib/apt/lists/*
    - ./scripts/deps.sh
    # -- README.md, secao "Build": os cinco alvos, na ordem --------------
    - make configure
    - make sdk
    - make models
    - make build
    - make install
  artifacts:
    when: always
    expire_in: 3 days
    paths:
      - build/meson-logs/
      - models/**/build/meson-logs/
      - dist/bin/
      - plugins/

test:
  stage: test
  extends: .ambiente
  timeout: 2h
  needs:
    - build
  script:
    - set -euo pipefail
    # A suite do core fica atras desta opcao (README.md, secao "Testes").
    # 'make test' roda SO o core (encadeia 'install' sozinho, Makefile);
    # a suite do MODELO e' um alvo a parte -- os dois, para cobrir o
    # mesmo par de relatorios JUnit de sempre (build/ e models/players/air/A-4/build/).
    - meson configure build -Dtests=true
    - make test-models
    - make test
    # Achado por auditoria: Node.js ja e' instalado em '.ambiente' (INSTALL.md
    # SS5) mas nunca era de fato CHAMADO por job nenhum -- a suite JS pura de
    # src/ui/ (edl_builder.test.js/edl_parser_core.test.js + self-lint) e a
    # geracao de docs/manual/ nunca rodavam em CI. 'node src/ui/scripts/
    # build.js' ja encadeia os dois arquivos de teste puros + self-lint +
    # geracao do edl-builder.html; o par de comandos de docs/manual/ e o
    # mesmo que 'make open-docs' roda, so sem o 'scripts/open_browser.sh'
    # final (nao ha navegador neste container).
    - node src/ui/scripts/build.js
    - python3 tools/generate_manual_catalog.py > docs/manual/catalog.generated.js
    - node docs/manual/compile.js
    # Achado por auditoria: 'make check-organization' (o linter de
    # organizacao interna de cada modelo, tools/check_organization.py) nunca
    # rodava em CI -- so manualmente. Descoberta por 'find', mesmo padrao ja
    # usado por check_modelo_estrutura.sh: modelo novo entra sozinho, sem
    # editar este arquivo.
    - |
      for meson_file in $(find models -mindepth 2 -name meson.build -not -path '*/build/*' -not -path '*/subprojects/*'); do
        grep -q '^project(' "$meson_file" || continue
        make -C "$(dirname "$meson_file")" check-organization
      done
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit:
        - build/meson-logs/testlog.junit.xml
        - models/**/A-4/build/meson-logs/testlog.junit.xml
    paths:
      - build/meson-logs/
      - models/**/A-4/build/meson-logs/

# Achado por auditoria: o caminho -Dasan=true (README.md/CLAUDE.md, "AddressSanitizer") nunca era
# exercitado em CI, so manualmente. 'allow_failure' porque este job e' deliberadamente
# COMPLEMENTAR (mesmo enquadramento que 'make test-asan' ja tem no Makefile: "fica fora da
# suite") -- um alarme falso de instrumentacao nao deve travar o pipeline principal, mas a
# cobertura passa a existir e a ficar visivel.
test-asan:
  stage: test
  extends: .ambiente
  timeout: 3h
  needs:
    - build
  allow_failure: true
  script:
    - set -euo pipefail
    - make test-asan

# Achado por auditoria: test-rl/test-rl-training (src/rl, src/poc/rl-training) nunca rodavam em
# CI -- sao os UNICOS testes que exercitam PyBindings.cpp/NativeSimulation.cpp/RLBridge.cpp
# contra uma Station de verdade. 'allow_failure' pelo custo do venv com torch (download pesado,
# pode faltar rede/tempo num runner compartilhado) -- mesmo raciocinio ja aplicado a
# 'make test-models' rodar separado de 'make test'.
test-rl:
  stage: test
  extends: .ambiente
  timeout: 2h
  needs:
    - build
  allow_failure: true
  script:
    - set -euo pipefail
    - make test-rl
    - make -C src/poc/rl-training test
