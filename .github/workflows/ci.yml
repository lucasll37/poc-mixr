# Equivalente em GitHub Actions do .gitlab-ci.yml -- mesmos quatro jobs
# (build, test, test-asan, test-rl), mesma sequencia de INSTALL.md, mesmo
# container ubuntu:24.04 sem nada pre-instalado, e as mesmas dependencias
# privadas (mixr/behaviortree.cpp.asa/jsbsim/openrti/Groot) SEMPRE
# compiladas do fonte via ./scripts/deps.sh -- nunca de um remote Conan
# privado (sem credencial nenhuma exigida aqui, igual ao original).
#
# Duas diferencas estruturais em relacao ao .gitlab-ci.yml, inerentes as
# duas plataformas:
#
# 1) O GitLab passa o estado de 'build' (build/, dist/, plugins/,
#    models/**/build, models/**/dist) para 'test'/'test-asan'/'test-rl' via
#    o mesmo cache generico ("build-$CI_COMMIT_REF_SLUG", chave de branch,
#    sobrescrito a cada pipeline). O GitHub Actions nao tem esse "barramento"
#    entre jobs da MESMA execucao -- aqui a entrega e' via
#    upload-artifact/download-artifact (o job 'build' publica um artefato
#    "build-state" que os tres outros baixam), que e' o mecanismo correto
#    (garante conteudo identico, sem depender de timing/hit de cache).
#    O ganho de velocidade "incremental entre pushes da mesma branch" que o
#    cache do GitLab tambem dava fica coberto, a parte, por um cache real
#    (actions/cache/restore + save) com chave por branch+run e
#    restore-keys por branch -- ver os dois passos comentados como
#    "cache de build" abaixo.
#
# 2) 'reports: junit' do GitLab (o widget nativo de resultado de teste) nao
#    tem equivalente de primeira classe aqui sem uma action de terceiros;
#    os relatorios JUnit continuam sendo publicados, so como artefato para
#    download (mesma cobertura de dados, sem o widget visual).
#
# Testar localmente antes de empurrar: nao ha um 'make test-ci' equivalente
# para GitHub Actions neste repositorio -- a ferramenta mais proxima e
# https://github.com/nektos/act (roda os jobs num container Docker local a
# partir deste mesmo arquivo).
#
# ---------------------------------------------------------------------------
# CORRECOES APLICADAS (em relacao a primeira versao deste arquivo)
# ---------------------------------------------------------------------------
# (a) 'defaults.run.shell: bash'. Sem isto, um step 'run:' que nao declara
#     'shell:' pode cair no fallback 'sh -e {0}' do runner -- e o /bin/sh do
#     Ubuntu e' o dash, que nao implementa 'pipefail'. Sintoma exato:
#       "set: Illegal option -o pipefail" + "exit code 2".
#     A action composta ./.github/actions/setup-ambiente nao era afetada
#     porque step de composite action e' OBRIGADO a declarar 'shell:' (e la
#     ja estava 'bash') -- foi justamente isso que provou que o bash existe
#     na imagem.
#
# (b) CONAN_HOME nao pode usar '${{ github.workspace }}'. Essa expressao e'
#     resolvida com o caminho do HOST (/home/runner/work/<repo>/<repo>),
#     que NAO existe dentro do container (la o workspace e'
#     /__w/<repo>/<repo>). O Conan acabava escrevendo fora da arvore
#     cacheada e o cache de pacotes Conan nunca dava hit. Agora e' resolvido
#     em runtime, via $PWD, num step apos o checkout de cada job.
#
# (c) 'git' instalado ANTES do actions/checkout. Sem git na imagem, o
#     checkout cai no download do tarball pela API REST: funciona, mas o
#     diretorio .git nao e' criado -- o que quebra 'git clone'/submodules em
#     ./scripts/deps.sh e qualquer 'vcs_tag()'/'git describe' no Meson.
#
# (d) O estado do build vai como TAR, nao como arvore solta.
#     upload-artifact/download-artifact nao preservam bit de execucao nem
#     symlink: 'dist/bin/' voltava sem +x nos tres jobs de teste e os
#     symlinks das arvores Meson/Ninja voltavam como copias. Empacotar
#     tambem troca dezenas de milhares de objetos por um arquivo so (upload
#     e download muito mais rapidos).
#
# (e) 'sudo' removido das chamadas apt. O job roda como root no container;
#     'sudo' so adiciona uma dependencia a mais. E 'apt' trocado por
#     'apt-get' (o 'apt' avisa que nao tem CLI estavel para scripts) com
#     --no-install-recommends, consistente com o resto do roteiro.
# ---------------------------------------------------------------------------

name: CI

on:
  push:
  pull_request:
  workflow_dispatch: # adicao em relacao ao .gitlab-ci.yml: permite disparo manual

permissions:
  contents: read

# Correcao (a): shell explicito para TODO step 'run:' de TODO job deste
# arquivo. Nao afeta a action composta (composite ignora 'defaults' e ja
# declara 'shell: bash' em cada step).
defaults:
  run:
    shell: bash

env:
  DEBIAN_FRONTEND: noninteractive
  # Linha do Node que INSTALL.md SS5 fixa ("24 Krypton", a LTS ativa).
  NODE_MAJOR: "24"
  # NOTA: CONAN_HOME saiu daqui de proposito -- ver correcao (b) no topo.
  # Cada job define a variavel em runtime, logo apos o checkout.
  #
  # Container efemero (descartado ao fim do job) entao nao ha risco de
  # __pycache__ vazar pro repositorio daqui -- mas os Makefiles ja exportam
  # isto para toda invocacao local de 'conan'/'python3'/'pytest' (ver
  # .gitignore), e repetir aqui mantem o ambiente do CI identico ao local.
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    # Container "pelado" ubuntu:24.04, sem nada pre-instalado -- mesma
    # premissa do 'image: ubuntu:24.04' do .gitlab-ci.yml (ao contrario da
    # imagem padrao dos runners hospedados do GitHub, que ja vem com uma
    # tonelada de ferramentas).
    container: ubuntu:24.04
    timeout-minutes: 360 # 6h, igual ao 'timeout: 6h' do job 'build' original
    steps:
      # Correcao (c): precisa vir ANTES do checkout.
      - name: "Pre-checkout: git + CA certificates"
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      # Correcao (b): caminho real DENTRO do container, resolvido em runtime.
      - name: "CONAN_HOME (caminho dentro do container)"
        run: echo "CONAN_HOME=$PWD/.conan2-cache" >> "$GITHUB_ENV"

      # Cache 1 do .gitlab-ci.yml: pacotes Conan, chaveado pelo CONTEUDO das
      # receitas (so muda quando uma versao de dependencia pinada muda, nao
      # a cada commit). 'actions/cache' ja salva/restaura sozinho (nao
      # precisa do par restore+save como o cache de build abaixo) porque a
      # chave e' baseada em hash de arquivo -- imutavel por natureza, sem o
      # problema de "nao da para sobrescrever uma chave existente" do GitHub
      # Actions.
      - name: "Cache: pacotes Conan"
        uses: actions/cache@v4
        with:
          path: .conan2-cache
          key: conan-${{ hashFiles('conanfile.py', 'deps/mixr/conanfile.py') }}

      # Cache 2 do .gitlab-ci.yml (parte "incremental entre pushes da mesma
      # branch"): aqui usado so como ACELERADOR entre EXECUCOES -- dentro
      # desta MESMA execucao, quem entrega o estado do build para os jobs de
      # teste e' o artifact "build-state" (upload mais abaixo), nao este
      # cache. Restaura o snapshot mais recente da MESMA branch (se houver);
      # o Meson/Ninja refazem so o que mudou desde entao.
      - name: "Cache: arvores de build (restaurar, se houver)"
        uses: actions/cache/restore@v4
        with:
          path: |
            build
            dist
            plugins
            models/**/build
            models/**/dist
          key: build-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            build-${{ github.ref_name }}-

      - name: "Ambiente (INSTALL.md SS1-SS3, SS5-SS6)"
        uses: ./.github/actions/setup-ambiente
        with:
          node-major: ${{ env.NODE_MAJOR }}

      # -- INSTALL.md SS4: pacotes do Groot + dependencias do fonte -------
      # So este job precisa deles (o 'test' nunca toca 'deps/groot'). O
      # 'apt-get update' NAO e redundante: a action de ambiente termina
      # removendo /var/lib/apt/lists/*, entao o indice de pacotes precisa
      # ser refeito antes deste 'apt-get install'.
      - name: "INSTALL.md SS4: pacotes do Groot"
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            cmake qtbase5-dev libqt5svg5-dev libzmq3-dev cppzmq-dev libdw-dev
          rm -rf /var/lib/apt/lists/*

      - name: "./scripts/deps.sh (mixr/behaviortree/jsbsim/openrti/Groot do fonte)"
        run: ./scripts/deps.sh

      # -- README.md, secao "Build": os cinco alvos, na ordem --------------
      - run: make configure
      - run: make sdk
      - run: make models
      - run: make build
      - run: make install

      # Salva o cache de build SEMPRE (mesmo com um passo anterior falho),
      # igual ao 'when: always' do cache original -- um pipeline que falhou
      # na metade ainda deixa o que ja foi construido disponivel para a
      # proxima tentativa.
      - name: "Cache: arvores de build (salvar)"
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            build
            dist
            plugins
            models/**/build
            models/**/dist
          key: build-${{ github.ref_name }}-${{ github.run_id }}

      - name: "Artefatos: logs + binarios (para inspecao humana)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          if-no-files-found: warn
          retention-days: 3
          path: |
            build/meson-logs/
            models/players/*/build/meson-logs/
            dist/bin/
            plugins/

      # Correcao (d): empacotar preserva permissao de execucao e symlink --
      # coisas que o par upload/download-artifact PERDE. Sem isto, 'dist/bin/'
      # chega nos jobs de teste sem +x.
      - name: "Empacotar estado do build (preserva +x e symlinks)"
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          paths=()
          for d in build dist plugins models/*/*/build models/*/*/dist; do
            if [ -e "$d" ]; then paths+=("$d"); fi
          done
          if [ "${#paths[@]}" -eq 0 ]; then
            echo "Nada construido -- nenhum estado de build a publicar." >&2
            exit 0
          fi
          tar -czf build-state.tar.gz "${paths[@]}"
          ls -lh build-state.tar.gz

      # Entrega o estado COMPLETO do build para 'test'/'test-asan'/'test-rl'
      # nesta MESMA execucao -- o equivalente funcional do 'needs: [build]'
      # + cache de branch do GitLab (ver nota (1) no topo deste arquivo).
      # Retencao curta: e' so um artefato de passagem interno ao pipeline.
      #
      # 'if-no-files-found: warn' (e nao 'error'): num build que falhou antes
      # de produzir qualquer coisa, um erro aqui so mascararia a causa raiz
      # no log. Os jobs de teste tem 'needs: build' e nem chegam a rodar.
      - name: "Artefatos: estado do build (para os jobs de teste)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-state
          if-no-files-found: warn
          retention-days: 1
          path: build-state.tar.gz

  test:
    needs: build
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    timeout-minutes: 120 # 2h, igual ao original
    steps:
      - name: "Pre-checkout: git + CA certificates"
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      - name: "CONAN_HOME (caminho dentro do container)"
        run: echo "CONAN_HOME=$PWD/.conan2-cache" >> "$GITHUB_ENV"

      - name: "Cache: pacotes Conan"
        uses: actions/cache@v4
        with:
          path: .conan2-cache
          key: conan-${{ hashFiles('conanfile.py', 'deps/mixr/conanfile.py') }}

      # Depois do checkout de proposito: 'actions/checkout' roda
      # 'git clean -ffdx' e apagaria o que fosse baixado antes dele.
      - name: "Baixar estado do build"
        uses: actions/download-artifact@v4
        with:
          name: build-state
          path: .

      - name: "Restaurar estado do build"
        run: |
          set -euo pipefail
          tar -xzf build-state.tar.gz
          rm -f build-state.tar.gz

      - name: "Ambiente (INSTALL.md SS1-SS3, SS5-SS6)"
        uses: ./.github/actions/setup-ambiente
        with:
          node-major: ${{ env.NODE_MAJOR }}

      # A suite do core fica atras desta opcao (README.md, secao "Testes").
      # 'make test' roda SO o core (encadeia 'install' sozinho, Makefile);
      # a suite do MODELO e' um alvo a parte -- os dois, para cobrir o mesmo
      # par de relatorios JUnit de sempre.
      - run: meson configure build -Dtests=true
      - run: make test-models
      - run: make test

      # A suite JS pura de src/ui/ (edl_builder.test.js/edl_parser_core.test.js
      # + self-lint) e a geracao de docs/manual/ -- o mesmo par de comandos
      # que 'make open-docs' roda, so sem o 'scripts/open_browser.sh' final
      # (nao ha navegador neste container).
      - run: node src/ui/scripts/build.js
      - run: python3 tools/generate_manual_catalog.py > docs/manual/catalog.generated.js
      - run: node docs/manual/compile.js

      # 'make check-organization' (o linter de organizacao interna de cada
      # modelo) para todo modelo descoberto por 'find' -- modelo novo entra
      # sozinho, sem editar este arquivo.
      #
      # 'find ... | while read' em vez de '$(find ...)' sem aspas: assim
      # caminho com espaco nao e' quebrado em dois. O 'while' roda em
      # subshell por causa do pipe, entao o status do 'make' e' propagado
      # explicitamente com o 'exit 1'.
      - name: "make check-organization (todo projeto de modelo)"
        run: |
          set -euo pipefail
          find models -mindepth 2 -name meson.build \
            -not -path '*/build/*' -not -path '*/subprojects/*' -print0 \
          | while IFS= read -r -d '' meson_file; do
              grep -q '^project(' "$meson_file" || continue
              make -C "$(dirname "$meson_file")" check-organization || exit 1
            done

      - name: "Artefatos: relatorios de teste"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          if-no-files-found: warn
          retention-days: 7
          path: |
            build/meson-logs/
            models/players/A-4/build/meson-logs/

  # 'allow_failure: true' no original -- caminho AddressSanitizer/
  # LeakSanitizer, complementar (mesmo enquadramento de 'make test-asan' no
  # Makefile: "fica fora da suite"). 'continue-on-error' e' o equivalente:
  # um alarme falso de instrumentacao nao trava o pipeline principal, mas a
  # cobertura passa a existir e a ficar visivel no resumo da execucao.
  test-asan:
    needs: build
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    timeout-minutes: 180 # 3h, igual ao original
    continue-on-error: true
    steps:
      - name: "Pre-checkout: git + CA certificates"
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      - name: "CONAN_HOME (caminho dentro do container)"
        run: echo "CONAN_HOME=$PWD/.conan2-cache" >> "$GITHUB_ENV"

      - name: "Cache: pacotes Conan"
        uses: actions/cache@v4
        with:
          path: .conan2-cache
          key: conan-${{ hashFiles('conanfile.py', 'deps/mixr/conanfile.py') }}

      - name: "Baixar estado do build"
        uses: actions/download-artifact@v4
        with:
          name: build-state
          path: .

      - name: "Restaurar estado do build"
        run: |
          set -euo pipefail
          tar -xzf build-state.tar.gz
          rm -f build-state.tar.gz

      - name: "Ambiente (INSTALL.md SS1-SS3, SS5-SS6)"
        uses: ./.github/actions/setup-ambiente
        with:
          node-major: ${{ env.NODE_MAJOR }}

      - run: make test-asan

  # Os UNICOS testes que exercitam PyBindings.cpp/NativeSimulation.cpp/
  # RLBridge.cpp contra uma Station de verdade. 'continue-on-error' pelo
  # custo do venv com torch (download pesado, pode faltar rede/tempo num
  # runner compartilhado) -- mesmo raciocinio ja aplicado a 'make
  # test-models' rodar separado de 'make test'.
  test-rl:
    needs: build
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    timeout-minutes: 120 # 2h, igual ao original
    continue-on-error: true
    steps:
      - name: "Pre-checkout: git + CA certificates"
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      - name: "CONAN_HOME (caminho dentro do container)"
        run: echo "CONAN_HOME=$PWD/.conan2-cache" >> "$GITHUB_ENV"

      - name: "Cache: pacotes Conan"
        uses: actions/cache@v4
        with:
          path: .conan2-cache
          key: conan-${{ hashFiles('conanfile.py', 'deps/mixr/conanfile.py') }}

      - name: "Baixar estado do build"
        uses: actions/download-artifact@v4
        with:
          name: build-state
          path: .

      - name: "Restaurar estado do build"
        run: |
          set -euo pipefail
          tar -xzf build-state.tar.gz
          rm -f build-state.tar.gz

      - name: "Ambiente (INSTALL.md SS1-SS3, SS5-SS6)"
        uses: ./.github/actions/setup-ambiente
        with:
          node-major: ${{ env.NODE_MAJOR }}

      - run: make test-rl
      - run: make -C src/poc/rl-training test