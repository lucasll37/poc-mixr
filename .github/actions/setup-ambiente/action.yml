# SALVAR COMO: .github/actions/setup-ambiente/action.yml
#
# Correcoes em relacao a primeira versao:
#  - 'sudo' removido de todas as chamadas: o job roda como root dentro do
#    container, entao 'sudo' so acrescenta uma dependencia (e falharia com
#    "sudo: not found" caso a linha do NodeSource fosse executada antes do
#    SS1, que e' quem instala o pacote).
#  - 'apt install' -> 'apt-get install': o 'apt' emite
#    "WARNING: apt does not have a stable CLI interface" em script.
#  - 'shell: bash' ja estava correto em cada step (obrigatorio em composite
#    action) -- e' o que fazia esta action passar enquanto o step solto do
#    workflow caia no 'sh -e {0}' e morria em "Illegal option -o pipefail".

name: "Ambiente (INSTALL.md)"
description: >-
  Sobe o ambiente do zero dentro do container ubuntu:24.04, replicando o
  ".ambiente"/before_script do .gitlab-ci.yml: pacotes de sistema (SS1) ->
  Conan via pipx (SS2) -> perfil default (SS3) -> Node.js pelo NodeSource
  (SS5) -> checagem final (SS6). SS4 (Groot + deps de fonte) fica FORA daqui
  de proposito -- so o job 'build' precisa, mesma razao do .gitlab-ci.yml.
inputs:
  node-major:
    description: "Linha major do Node.js (INSTALL.md SS5)"
    required: false
    default: "24"
runs:
  using: "composite"
  steps:
    # Tudo num script SO -- mesma semantica do before_script do GitLab, onde
    # todas as linhas rodam na MESMA sessao de shell (por isso o 'export
    # PATH' do meio continua valendo para os comandos seguintes deste
    # bloco). Em Actions cada STEP novo perde variavel exportada em shell
    # anterior; concentrar num unico 'run:' evita reexportar em cada passo.
    - name: "INSTALL.md SS1-SS3, SS5-SS6"
      shell: bash
      run: |
        set -euo pipefail

        # -- SS1: pacotes de sistema -----------------------------------
        # Mesma lista testada no roteiro (Ubuntu 24.04 do zero), sem os
        # recomendados. 'git' e 'ca-certificates' ja costumam estar
        # presentes (o workflow os instala antes do checkout), mas ficam na
        # lista para esta action continuar autossuficiente se usada solta.
        apt-get update
        apt-get install -y --no-install-recommends \
          build-essential ninja-build meson pkg-config git curl perl patch \
          zlib1g-dev python3 python3-venv python3-dev pipx gzip ca-certificates
        rm -rf /var/lib/apt/lists/*

        # -- SS2: Conan via pipx, nao pip --------------------------------
        # Ubuntu 24.04 recusa 'pip install' fora de venv (PEP 668) e nao ha
        # pacote 'conan' no apt.
        pipx install conan
        pipx ensurepath
        # HOME num job de container do GitHub Actions NAO e '/root' por
        # padrao (costuma ser '/github/home') -- ao contrario do runner do
        # GitLab. Usar $HOME em vez de fixar '/root/.local/bin' evita
        # depender desse detalhe de implementacao.
        export PATH="${HOME}/.local/bin:${PATH}"
        conan --version

        # -- SS3: perfil default ----------------------------------------
        # Sem isto o primeiro 'make configure' morre com "The default build
        # profile doesn't exist".
        #
        # Registra no log onde o Conan esta de fato guardando os pacotes --
        # util para confirmar que CONAN_HOME aponta para dentro da arvore do
        # workspace (e portanto cai no cache), e nao para um caminho do HOST
        # que nao existe neste container.
        echo "CONAN_HOME=${CONAN_HOME:-<nao definido>}"
        conan profile detect --force
        # SEM remote privado nenhum -- ver o comentario do topo do
        # .gitlab-ci.yml original. Isto so registra no log que o unico
        # remote presente e o conancenter de fabrica.
        conan remote list

        # -- SS5: Node.js pelo NodeSource --------------------------------
        # 'setup_<N>.x' roda o PROPRIO apt-get update e instala sozinho os
        # pre-requisitos que a imagem nao tem (gnupg, apt-transport-https).
        curl -fsSL "https://deb.nodesource.com/setup_${{ inputs.node-major }}.x" | bash -
        apt-get install -y --no-install-recommends nodejs
        npm install -g npm@latest
        rm -rf /var/lib/apt/lists/*

        # -- SS6: checagem final ------------------------------------------
        gcc --version
        meson --version
        ninja --version
        pkg-config --version
        conan --version
        node --version
        npm --version

        # Disponibiliza o Conan (instalado via pipx em $HOME/.local/bin)
        # para os passos SEGUINTES deste job (make configure/sdk/... chamam
        # 'conan' direto) -- GITHUB_PATH so tem efeito a partir do PROXIMO
        # step, por isso o 'export PATH' explicito acima cobre este mesmo
        # script e esta linha cobre o resto do job.
        echo "${HOME}/.local/bin" >> "$GITHUB_PATH"