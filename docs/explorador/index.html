<title>Explorador de Execução MIXR</title>
<meta charset="utf-8">
<style>
:root{
  --bg:#0f1115; --panel:#161923; --panel2:#1c2030; --border:#2a2f42;
  --text:#dfe3ee; --dim:#8890a8; --accent:#5eb0ff; --accent2:#ffb454;
  --ok:#57c785; --idle:#5a6178; --warn:#ff6b6b; --stack:#c98bff;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin:0}
h1,h2,h3{font-family:ui-sans-serif,system-ui,sans-serif;margin:0}
button{font:inherit;cursor:pointer;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:4px 9px}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=range]{accent-color:var(--accent)}
.topbar{display:flex;align-items:center;gap:14px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
.topbar h1{font-size:15px;color:var(--accent)}
.tabs{display:flex;gap:4px}
.tabs button[aria-pressed=true]{background:var(--accent);color:#06121f;border-color:var(--accent)}
.transport{display:flex;align-items:center;gap:6px;flex:1;min-width:280px}
.transport input[type=range]{flex:1}
.filterbar{display:flex;align-items:center;gap:8px}
.counters{display:flex;gap:12px;padding:5px 14px;background:var(--panel2);border-bottom:1px solid var(--border);font-size:12px;color:var(--dim);flex-wrap:wrap}
.counters b{color:var(--text)}
.phaseStrip{display:flex;gap:3px;padding:4px 14px;background:var(--panel2);border-bottom:1px solid var(--border)}
.phaseStrip span{flex:1;text-align:center;font-size:11px;padding:3px 4px;border-radius:3px;background:#12141c;color:var(--dim)}
.phaseStrip span.on{background:var(--accent);color:#06121f;font-weight:600}
.cols{display:grid;grid-template-columns:minmax(280px,1fr) minmax(340px,1.3fr) minmax(260px,0.9fr);height:calc(100vh - 118px)}
.col{overflow:auto;border-right:1px solid var(--border)}
.col:last-child{border-right:none}
.colhead{position:sticky;top:0;background:var(--panel);padding:6px 10px;font:600 11px ui-sans-serif,sans-serif;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);z-index:2}
svg{display:block}
.node rect{fill:var(--panel2);stroke:var(--border);stroke-width:1;rx:4}
.node.active rect{fill:#2a3f2a;stroke:var(--ok);stroke-width:2}
.node.stack rect{stroke:var(--stack);stroke-width:1.6}
.node.idle rect{stroke-dasharray:3,2;opacity:.55}
.node.selected rect{stroke:var(--accent2);stroke-width:2}
.node.unborn rect{stroke-dasharray:2,3;fill:transparent;opacity:.4}
.node text{fill:var(--text);font-size:10px;pointer-events:none}
.node .cls{fill:var(--dim);font-size:8px}
.node{cursor:pointer}
.edge{stroke:var(--border);stroke-width:1;fill:none}
.evtEdge{stroke:var(--accent2);stroke-width:1.6;stroke-dasharray:4,3;fill:none;marker-end:url(#arrow)}
.evtLabel{fill:var(--accent2);font-size:9px}
pre.code{margin:0;padding:8px 0 40px;font-size:12.5px}
.codepath{position:sticky;top:0;background:var(--panel);padding:6px 10px;font-size:11px;color:var(--accent);border-bottom:1px solid var(--border)}
.codeline{display:flex;white-space:pre}
.codeline .ln{width:44px;flex:none;text-align:right;padding-right:10px;color:#4d5468;user-select:none}
.codeline.hl{background:#2a3350}
.codeline.hl .ln{color:var(--accent)}
.panel{padding:10px;border-bottom:1px solid var(--border)}
.panel h3{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--dim);margin-bottom:6px}
.panel .title{font:600 13px ui-sans-serif,sans-serif;color:var(--accent);margin-bottom:4px}
.panel .body{color:var(--text)}
.panel .warn{margin-top:6px;padding:6px 8px;background:#3a1c1c;border:1px solid var(--warn);border-radius:4px;color:#ffb3b3}
.stackList{list-style:none;margin:0;padding:0}
.stackList li{padding:2px 0;color:var(--dim);border-left:2px solid var(--border);padding-left:8px;margin-bottom:2px}
.stackList li.top{color:var(--text);border-left-color:var(--stack)}
.chainList{list-style:none;margin:0;padding:0}
.chainList li{padding:3px 6px;margin-bottom:3px;border-radius:3px;background:var(--panel2);display:flex;justify-content:space-between;gap:6px}
.chainList li.dispatch{outline:1px dashed var(--dim)}
.chainList li.acting{background:#2a3f2a;outline:1px solid var(--ok)}
.chainList small{color:var(--dim)}
.emptyHint{padding:14px;color:var(--dim);font-size:12px}
.legend{font-size:11px;color:var(--dim);padding:6px 10px;display:flex;gap:14px;flex-wrap:wrap;border-top:1px solid var(--border)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.swatch{width:10px;height:10px;border-radius:2px;display:inline-block}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
@media (max-width: 880px){
  .cols{grid-template-columns:1fr;height:auto}
  .col{height:60vh;border-right:none;border-bottom:1px solid var(--border)}
}
</style>

function sigSwitch() {
  return n('signature', 'SigSwitch', {
    chain: ['SigSwitch', 'RfSignature'],
    note: 'Ocioso confirmado: RfSignature nunca sobrescreve nenhum dos 7 metodos. getRCS() e chamado sob demanda pelo RfSensor de quem ilumina o alvo -- nunca pelo laco de frame. camouflageType escolhe qual dos 6 filhos abaixo responde (SigSwitch::getRCS(), Signatures.cpp).',
    children: [
      n('sig_limpo', 'SigSphere', { chain: ['SigSphere', 'RfSignature'] }),
      n('sig_placa', 'SigPlate', { chain: ['SigPlate', 'RfSignature'] }),
      n('sig_const', 'SigConstant', { chain: ['SigConstant', 'RfSignature'] }),
      n('sig_died', 'SigDihedralCR', { chain: ['SigDihedralCR', 'SigPlate', 'RfSignature'] }),
      n('sig_tried', 'SigTrihedralCR', { chain: ['SigTrihedralCR', 'SigDihedralCR', 'SigPlate', 'RfSignature'] }),
      n('sig_azel', 'SigAzEl', { chain: ['SigAzEl', 'RfSignature'] }),

}

function trkMgr(id, cls, chainExtra) {
  return n(id, cls, {
    phases: [3],
    chain: [cls].concat(chainExtra || ['TrackManager', 'System']),
    dispatch: 'System',
    srcKeys: ['TrackManager::newReport', 'System::updateTC'],
    note: 'Resolvido por NOME (trackManagerName: ' + id + '), nao por tipo -- um erro de digitacao no .epp nao falha a carga, so silencia o sensor.',
  });
}

function antenna(id, note) {
  return n(id, 'Antenna', {
    phases: [0, 3],
    chain: ['Antenna', 'ScanGimbal', 'Gimbal', 'System'],
    dispatch: 'System',
    srcKeys: ['Antenna::rfTransmit', 'System::updateTC'],
    note: note || 'ScanGimbal/Gimbal::dynamics() varrem fisicamente a antena (fase 0); Antenna::process() e o helper rfTransmit() fazem o trabalho de RF.',

}

   Babel via CDN) -- a UI. NAO conhece MIXR: nenhuma regra de fase/dt4/idle
   esta escrita aqui, so consome os campos ja calculados de SCENARIO/SRC/
   TRACES. Se um dia esta UI precisar "saber" o que e uma fase para desenhar
   algo, e sinal de que o dado deveria ter vindo pronto de scenario.js.
============================================================================ */
const h = React.createElement;
const { useState, useEffect, useRef, useMemo } = React;

// ---- layout recursivo da arvore (~25 linhas, sem lib de grafo) -----------
const NODE_W = 150, NODE_H = 28, H_GAP = 16, V_GAP = 58;

function layoutTree(root, collapsedIds) {
  function measure(node, depth) {
    const collapsed = collapsedIds.has(node.id) && (node.children || []).length > 0;
    const kids = collapsed ? [] : (node.children || []);
    node._collapsed = collapsed;
    node._kids = kids;
    node._depth = depth;
    if (kids.length === 0) {
      node._w = NODE_W;
    } else {
      let total = 0;
      kids.forEach((c, i) => { total += measure(c, depth + 1) + (i > 0 ? H_GAP : 0); });
      node._w = Math.max(NODE_W, total);
    }
    return node._w;
  }
  function place(node, x0) {
    const kids = node._kids;
    if (kids.length === 0) {
      node._x = x0 + node._w / 2;
    } else {
      const kidsTotal = kids.reduce((a, c) => a + c._w, 0) + (kids.length - 1) * H_GAP;
      let cursor = x0 + (node._w - kidsTotal) / 2;
      kids.forEach(c => { place(c, cursor); cursor += c._w + H_GAP; });
      node._x = (kids[0]._x + kids[kids.length - 1]._x) / 2;
    }
    node._y = node._depth * V_GAP + NODE_H / 2 + 12;
  }
  measure(root, 0);
  place(root, 0);
  return root;
}

function flattenVisible(root) {
  const nodes = [], edges = [];
  (function walk(node) {
    nodes.push(node);
    node._kids.forEach(c => { edges.push([node, c]); walk(c); });
  })(root);
  return { nodes, edges };
}

function findNode(root, id) {
  if (root.id === id) return root;
  for (const c of (root.children || [])) { const r = findNode(c, id); if (r) return r; }
  return null;
}

function ancestorsOf(root, id, path) {
  path = path || [];
  if (root.id === id) return path;
  for (const c of (root.children || [])) {
    const r = ancestorsOf(c, id, path.concat([root.id]));
    if (r) return r;
  }
  return null;
}

function countDescendants(node) {
  let c = 0;
  (function walk(n) { (n.children || []).forEach(k => { c++; walk(k); }); })(node);
  return c;
}

function defaultCollapsed() {
  // Colapsa a partir da profundidade 5 (os subsistemas diretos de falcon1 --
  // profundidade 4 -- ficam visiveis de cara; o que colapsa e o NIVEL
  // seguinte: as 6 antenas dentro de Gimbal, os 8 itens de StoresMgr, os 4
  // steerpoints da Route, os 6 filhos de SigSwitch etc.)
  const s = new Set();
  (function walk(node, depth) {
    if ((node.children || []).length > 0 && depth >= 5) s.add(node.id);
    (node.children || []).forEach(c => walk(c, depth + 1));
  })(SCENARIO, 0);
  return s;
}

function collectDynamicIds() {
  const s = new Set();
  (function walk(n) { if (n.dynamic) s.add(n.id); (n.children || []).forEach(walk); })(SCENARIO);
  return s;
}

function computeDefaultDynamicBorn(steps, dynamicIds) {
  const hasSpawn = new Set(), hasDespawn = new Set();
  steps.forEach(s => { if (s.spawn) hasSpawn.add(s.spawn); if (s.despawn) hasDespawn.add(s.despawn); });
  const born = new Set();
  dynamicIds.forEach(id => { if (hasDespawn.has(id) && !hasSpawn.has(id)) born.add(id); });
  return born;
}

function computeExistence(steps, uptoIndex, defaultBorn) {
  const set = new Set(defaultBorn);
  for (let i = 0; i <= uptoIndex; i++) {
    const s = steps[i];
    if (!s) continue;
    if (s.spawn) set.add(s.spawn);
    if (s.despawn) set.delete(s.despawn);
  }
  return set;
}

function prefersReducedMotion() {
  return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}

// ---- arvore SVG -----------------------------------------------------------
function Tree(props) {
  const { root, collapsedIds, onToggle, onSelect, selectedId, activeId, eventToId, stackIds, existing } = props;
  const containerRef = useRef(null);
  layoutTree(root, collapsedIds);
  const { nodes, edges } = flattenVisible(root);
  const maxX = Math.max(150, ...nodes.map(n => n._x)) + NODE_W;
  const maxY = Math.max(80, ...nodes.map(n => n._y)) + NODE_H;
  const activeNode = eventToId ? nodes.find(n => n.id === activeId) : null;
  const toNode = eventToId ? nodes.find(n => n.id === eventToId) : null;

  // Sem isto, o no ativo pode ficar bem longe do canto (0,0) onde a rolagem
  // comeca -- 'station' e centralizado sobre TODOS os filhos, inclusive a
  // subarvore enorme de 'simulation', e fica fora da vista sem isto (medido
  // rodando: so 'plugins'/'agent1' apareciam no primeiro quadro).
  useEffect(() => {
    if (!containerRef.current) return;
    const el = containerRef.current.querySelector('#node-' + CSS.escape(activeId || ''));
    if (el) el.scrollIntoView({ block: 'center', inline: 'center', behavior: prefersReducedMotion() ? 'auto' : 'smooth' });
  }, [activeId]);

  return h('div', { ref: containerRef },
  h('svg', { width: maxX, height: maxY, role: 'tree', 'aria-label': 'Árvore de contenção MIXR' },
    h('defs', null,
      h('marker', { id: 'arrow', viewBox: '0 0 10 10', refX: 8, refY: 5, markerWidth: 6, markerHeight: 6, orient: 'auto-start-reverse' },
        h('path', { d: 'M0,0 L10,5 L0,10 z', fill: 'var(--accent2)' }))),
    edges.map(([p, c]) => h('line', { key: p.id + '>' + c.id, className: 'edge', x1: p._x, y1: p._y + NODE_H / 2, x2: c._x, y2: c._y - NODE_H / 2 })),
    (activeNode && toNode) ? h('g', { key: '__evt' },
      h('line', { className: 'evtEdge', x1: activeNode._x, y1: activeNode._y, x2: toNode._x, y2: toNode._y }),
      h('text', { className: 'evtLabel', x: (activeNode._x + toNode._x) / 2, y: (activeNode._y + toNode._y) / 2 - 6, textAnchor: 'middle' }, 'evento')
    ) : null,
    nodes.map(node => {
      const classes = ['node'];
      if (node.id === activeId) classes.push('active');
      if (stackIds.has(node.id) && node.id !== activeId) classes.push('stack');
      if (node.idle) classes.push('idle');
      if (node.id === selectedId) classes.push('selected');
      const unborn = node.dynamic && !existing.has(node.id);
      if (unborn) classes.push('unborn');
      const hasKids = (node.children || []).length > 0;
      return h('g', {
        key: node.id, id: 'node-' + node.id, className: classes.join(' '),
        transform: 'translate(' + (node._x - NODE_W / 2) + ',' + (node._y - NODE_H / 2) + ')',
        tabIndex: 0, role: 'treeitem', 'aria-selected': node.id === selectedId,
        'aria-label': node.id + ', classe ' + node.cls + (node.idle ? ', ocioso' : '') + (unborn ? ', ainda não criado' : ''),
        onClick: (e) => { e.stopPropagation(); onSelect(node.id); },
        onKeyDown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onSelect(node.id); } },
      },
        h('rect', { width: NODE_W, height: NODE_H }),
        h('text', { x: 8, y: hasKids ? 12 : 17 }, (hasKids ? (node._collapsed ? '▸ ' : '▾ ') : '') + node.id),
        h('text', {
          className: 'cls', x: 8, y: 24,
          onClick: hasKids ? (e) => { e.stopPropagation(); onToggle(node.id); } : undefined,
        }, node.cls + (node._collapsed ? ' [+' + countDescendants(node) + ']' : ''))
      );
    })
  ));
}

// ---- painel de codigo -------------------------------------------------
function CodePanel({ srcKey, hl }) {
  const containerRef = useRef(null);
  const lines = useMemo(() => (srcKey && SRC[srcKey]) ? flattenSrc(SRC[srcKey]) : null, [srcKey]);

  useEffect(() => {
    if (!hl || !containerRef.current) return;
    const el = containerRef.current.querySelector('[data-ln="' + hl[0] + '"]');
    if (el) el.scrollIntoView({ block: 'center', behavior: prefersReducedMotion() ? 'auto' : 'smooth' });
  }, [srcKey, hl ? hl[0] : null, hl ? hl[1] : null]);

  if (!lines) return h('div', { className: 'emptyHint' }, 'Nenhum trecho de fonte associado a este passo.');

  return h(React.Fragment, null,
    h('div', { className: 'codepath' }, SRC[srcKey].file),
    h('pre', { className: 'code', ref: containerRef },
      lines.map((l, i) => {
        const inRange = hl && l.ln !== null && l.ln >= hl[0] && l.ln <= hl[1];
        return h('div', { key: i, className: 'codeline' + (inRange ? ' hl' : ''), 'data-ln': l.ln },
          h('span', { className: 'ln' }, l.ln !== null ? l.ln : ''),
          h('span', null, l.text));
      })
    )
  );
}

// ---- paineis laterais ---------------------------------------------------
function StepPanel({ step }) {
  if (!step) return h('div', { className: 'panel' }, h('div', { className: 'emptyHint' }, 'Sem passo selecionado.'));
  return h('div', { className: 'panel' },
    h('h3', null, 'Passo atual'),
    h('div', { className: 'title' }, step.title),
    step.body ? h('div', { className: 'body' }, step.body) : null,
    step.warn ? h('div', { className: 'warn' }, '⚠ ' + step.warn) : null
  );
}

function StackPanel({ stack }) {
  return h('div', { className: 'panel' },
    h('h3', null, 'Pilha de chamadas'),
    (stack && stack.length) ? h('ul', { className: 'stackList' },
      stack.map((s, i) => h('li', { key: i, className: i === stack.length - 1 ? 'top' : '' }, s.label + '  —  ' + s.node))
    ) : h('div', { className: 'emptyHint' }, '(vazio neste passo)')
  );
}

function ChainPanel({ node, onFollow, following }) {
  if (!node) return h('div', { className: 'panel' }, h('h3', null, 'Herança'), h('div', { className: 'emptyHint' }, 'Clique num nó da árvore para inspecionar.'));
  return h('div', { className: 'panel' },
    h('h3', null, 'Nó inspecionado — ' + node.id + (following ? ' (seguindo o passo)' : '')),
    h('ul', { className: 'chainList' },
      node.chain.map((cls, i) => h('li', { key: i, className: cls === node.dispatch ? 'dispatch' : (i === 0 ? 'acting' : '') },
        h('span', null, cls), cls === node.dispatch ? h('small', null, 'switch(phase) aqui') : null))
    ),
    node.note ? h('div', { className: 'body', style: { marginTop: '8px' } }, node.note) : null,
    !following ? h('button', { style: { marginTop: '8px' }, onClick: onFollow }, 'Voltar a seguir o passo atual') : null
  );
}

function CountersBar({ c, dt }) {
  if (!c) return h('div', { className: 'counters' });
  return h('div', { className: 'counters' },
    h('span', null, 'ciclo ', h('b', null, c.cycle)),
    h('span', null, 'frame ', h('b', null, c.frame)),
    h('span', null, 'fase ', h('b', null, (c.phase === null || c.phase === undefined) ? '—' : c.phase)),
    h('span', null, 'exec ', h('b', null, c.exec)),
    h('span', null, 't sim ', h('b', null, c.simT)),
    h('span', null, 'dt ', h('b', null, (dt != null) ? dt.toFixed(4) + 's' : '—'))
  );
}

function PhaseStrip({ phase }) {
  const labels = ['0 dynamics', '1 transmit', '2 receive', '3 process'];
  return h('div', { className: 'phaseStrip' },
    labels.map((l, i) => h('span', { key: i, className: phase === i ? 'on' : '' }, l)),
    h('span', { className: (phase !== 0 && phase !== 1 && phase !== 2 && phase !== 3) ? 'on' : '' }, 'fundo / reset')
  );
}

// ---- App ------------------------------------------------------------------
const CHAINS = [
  ['quadro', '(a) Quadro'],
  ['fundo', '(b) Thread de fundo'],
  ['reset', '(c) Reset'],
];
const SPEEDS = [0.5, 1, 2, 4, 8];

function App() {
  const [chain, setChain] = useState('quadro');
  const [stepIndex, setStepIndex] = useState(0);
  const [playing, setPlaying] = useState(false);
  const [speed, setSpeed] = useState(2);
  const [hideIdle, setHideIdle] = useState(false);
  const [collapsedIds, setCollapsedIds] = useState(defaultCollapsed);
  const [selectedId, setSelectedId] = useState(null);

  const dynamicIds = useMemo(collectDynamicIds, []);
  const allSteps = TRACES[chain];
  const defaultBorn = useMemo(() => computeDefaultDynamicBorn(allSteps, dynamicIds), [chain, allSteps, dynamicIds]);
  const visibleSteps = useMemo(() => hideIdle ? allSteps.filter(s => !s.idle) : allSteps, [chain, hideIdle, allSteps]);

  useEffect(() => { setStepIndex(0); setPlaying(false); }, [chain, hideIdle]);

  const step = visibleSteps[stepIndex] || null;
  const originalIndex = step ? allSteps.indexOf(step) : -1;
  const existing = useMemo(() => computeExistence(allSteps, originalIndex, defaultBorn), [allSteps, originalIndex, defaultBorn]);
  const stackIds = useMemo(() => new Set((step && step.stack || []).map(s => s.node)), [step]);

  // auto-expande o caminho ate os nos relevantes do passo atual
  useEffect(() => {
    if (!step) return;
    const targets = [step.node, step.to, step.spawn, step.despawn].filter(Boolean);
    setCollapsedIds(prev => {
      const next = new Set(prev);
      let changed = false;
      targets.forEach(id => {
        const anc = ancestorsOf(SCENARIO, id) || [];
        anc.forEach(a => { if (next.has(a)) { next.delete(a); changed = true; } });
      });
      return changed ? next : prev;
    });
  }, [step]);

  // reproducao (indice de array, discreta -- nao e requestAnimationFrame)
  useEffect(() => {
    if (!playing) return;
    const id = setInterval(() => {
      setStepIndex(i => {
        if (i >= visibleSteps.length - 1) return i;
        return i + 1;
      });
    }, 1000 / speed);
    return () => clearInterval(id);
  }, [playing, speed, visibleSteps.length]);

  useEffect(() => { if (playing && stepIndex >= visibleSteps.length - 1) setPlaying(false); }, [playing, stepIndex, visibleSteps.length]);

  // atalhos de teclado
  useEffect(() => {
    function onKey(e) {
      const tag = e.target && e.target.tagName;
      if (tag === 'INPUT' || tag === 'SELECT' || tag === 'BUTTON') return;
      if (e.key === 'ArrowRight') setStepIndex(i => Math.min(visibleSteps.length - 1, i + 1));
      else if (e.key === 'ArrowLeft') setStepIndex(i => Math.max(0, i - 1));
      else if (e.key === ' ') { e.preventDefault(); setPlaying(p => !p); }
    }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [visibleSteps.length]);

  const following = selectedId === null;
  const inspectedId = following ? (step && step.node) : selectedId;
  const inspectedNode = inspectedId ? findNode(SCENARIO, inspectedId) : null;

  return h('div', null,
    h('div', { className: 'topbar' },
      h('h1', null, 'Explorador de Execução MIXR'),
      h('nav', { className: 'tabs', role: 'tablist', 'aria-label': 'Cadeia de trace' },
        CHAINS.map(([k, label]) => h('button', { key: k, role: 'tab', 'aria-pressed': chain === k, onClick: () => setChain(k) }, label))
      ),
      h('div', { className: 'transport' },
        h('button', { onClick: () => setStepIndex(i => Math.max(0, i - 1)), 'aria-label': 'passo atrás', title: '← passo atrás' }, '⏮'),
        h('button', { onClick: () => setPlaying(p => !p), 'aria-label': playing ? 'pausar' : 'reproduzir', title: 'espaço: reproduzir/pausar' }, playing ? '⏸' : '▶'),
        h('button', { onClick: () => setStepIndex(i => Math.min(visibleSteps.length - 1, i + 1)), 'aria-label': 'passo à frente', title: '→ passo à frente' }, '⏭'),
        h('input', {
          type: 'range', min: 0, max: Math.max(0, visibleSteps.length - 1), value: stepIndex,
          onChange: (e) => setStepIndex(Number(e.target.value)), 'aria-label': 'posição no trace',
        }),
        h('span', null, (visibleSteps.length ? stepIndex + 1 : 0) + ' / ' + visibleSteps.length),
        h('select', { value: speed, onChange: (e) => setSpeed(Number(e.target.value)), 'aria-label': 'velocidade de reprodução' },
          SPEEDS.map(v => h('option', { key: v, value: v }, v + 'x/s')))
      ),
      h('div', { className: 'filterbar' },
        h('label', null,
          h('input', { type: 'checkbox', checked: hideIdle, onChange: (e) => setHideIdle(e.target.checked) }),
          ' esconder passos ociosos')
      )
    ),
    h(CountersBar, { c: step && step.counters, dt: step && step.dt }),
    h(PhaseStrip, { phase: step && step.counters ? step.counters.phase : null }),
    h('div', { className: 'cols' },
      h('div', { className: 'col' },
        h('div', { className: 'colhead' }, 'Árvore de contenção'),
        visibleSteps.length ? h(Tree, {
          root: SCENARIO, collapsedIds,
          onToggle: (id) => setCollapsedIds(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; }),
          onSelect: setSelectedId,
          selectedId: inspectedId, activeId: step && step.node, eventToId: step && step.to,
          stackIds, existing,
        }) : h('div', { className: 'emptyHint' }, 'Nenhum passo nesta cadeia com o filtro atual.')
      ),
      h('div', { className: 'col' },
        h('div', { className: 'colhead' }, step ? (step.src || 'sem trecho de fonte') : 'código'),
        h(CodePanel, { srcKey: step && step.src, hl: step && step.hl })
      ),
      h('div', { className: 'col' },
        h(StepPanel, { step }),
        h(StackPanel, { stack: step && step.stack }),
        h(ChainPanel, { node: inspectedNode, following, onFollow: () => setSelectedId(null) }),
        h('div', { className: 'legend' },
          h('span', null, h('span', { className: 'swatch', style: { background: '#2a3f2a', border: '2px solid #57c785' } }), 'em execução'),
          h('span', null, h('span', { className: 'swatch', style: { border: '1.6px solid #c98bff' } }), 'na pilha'),
          h('span', null, h('span', { className: 'swatch', style: { border: '1px dashed #8890a8', opacity: .6 } }), 'ocioso'),
          h('span', null, h('span', { className: 'swatch', style: { border: '1px dashed #8890a8', opacity: .3 } }), 'ainda não criado')
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
