<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Refatoração do ASA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#0E1416; --surface:#161D20; --surface-2:#1D262A; --raised:#232D31;
  --ink:#E8EDE7; --muted:#8FA09B; --line:#2B3538; --grid:rgba(255,255,255,.035);
  --accent:#D34F97; --accent-ink:#1B0E14; --accent-soft:rgba(211,79,151,.14);
  --teal:#4CB6AC; --teal-soft:rgba(76,182,172,.14);
  --amber:#E3A93F; --amber-soft:rgba(227,169,63,.12);
  --brick:#D0665A; --brick-soft:rgba(208,102,90,.12);
  --shadow:0 18px 40px -20px rgba(0,0,0,.6);
  --font-display:'Big Shoulders Display','Arial Narrow',sans-serif;
  --font-body:'Public Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#EDEBDE; --surface:#F8F6EC; --surface-2:#E3E0D0; --raised:#FFFFFF;
    --ink:#1B2422; --muted:#5C6D67; --line:#CBC6B2; --grid:rgba(27,36,34,.05);
    --accent:#9C2E6C; --accent-ink:#FBEFF6; --accent-soft:rgba(156,46,108,.10);
    --teal:#1E7A72; --teal-soft:rgba(30,122,114,.10);
    --amber:#9C6A16; --amber-soft:rgba(156,106,22,.10);
    --brick:#A13627; --brick-soft:rgba(161,54,39,.10);
    --shadow:0 18px 40px -22px rgba(27,36,34,.25);
  }
}
:root[data-theme="light"]{
  --bg:#EDEBDE; --surface:#F8F6EC; --surface-2:#E3E0D0; --raised:#FFFFFF;
  --ink:#1B2422; --muted:#5C6D67; --line:#CBC6B2; --grid:rgba(27,36,34,.05);
  --accent:#9C2E6C; --accent-ink:#FBEFF6; --accent-soft:rgba(156,46,108,.10);
  --teal:#1E7A72; --teal-soft:rgba(30,122,114,.10);
  --amber:#9C6A16; --amber-soft:rgba(156,106,22,.10);
  --brick:#A13627; --brick-soft:rgba(161,54,39,.10);
  --shadow:0 18px 40px -22px rgba(27,36,34,.25);
}

*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body);
  overflow:hidden; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{text-wrap:balance; margin:0;}
p{margin:0;}
::selection{background:var(--accent); color:var(--accent-ink);}
button{font:inherit; color:inherit;}
:focus-visible{outline:2px solid var(--teal); outline-offset:3px;}

.deck{position:relative; width:100%; height:100vh; height:100dvh; overflow:hidden;}
.deck::before{
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:56px 56px;
}

.tick{position:fixed; width:20px; height:20px; border-color:var(--line); pointer-events:none; z-index:6;}
.tick--tl{top:14px; left:14px; border-top:2px solid; border-left:2px solid;}
.tick--tr{top:14px; right:14px; border-top:2px solid; border-right:2px solid;}
.tick--bl{bottom:66px; left:14px; border-bottom:2px solid; border-left:2px solid;}
.tick--br{bottom:66px; right:14px; border-bottom:2px solid; border-right:2px solid;}

.slide{
  position:absolute; inset:0; z-index:1; display:flex; flex-direction:column;
  /* gap/padding-top reagem a vmin (o menor entre largura e altura) e padding-bottom a vh --
     numa janela baixa (nao so estreita) isso libera espaco vertical de verdade, em vez de so
     depender de vw como antes (que ignorava altura por completo). O ajuste FINO fica por conta
     do --fit-scale abaixo (calculado em JS, ver fitAllSlides() no script de navegacao): quando o
     conteudo natural de uma slide (scrollHeight) ainda nao cabe na altura disponivel
     (clientHeight) mesmo com esse clamp, a slide inteira encolhe (como um zoom-out, nao so a
     fonte) ate' caber. overflow-y fica HIDDEN por padrao de proposito -- um transform:scale()
     NAO muda scrollHeight/clientHeight (e' so' pintura, nao afeta layout), entao um
     overflow-y:auto full-time deixaria a slide "tecnicamente" scrollavel mesmo depois de encolhida
     visualmente ate' caber, e um scroll do mouse ficaria preso rolando um resquicio invisivel
     antes de trocar de slide. So' quando o encolhimento bate no PISO (FIT_MIN_SCALE) e ainda
     sobra conteudo de verdade e' que a slide ganha a classe ".is-overflowing" (JS) e volta a
     ser scrollavel de verdade -- ver a regra logo abaixo e o handler de wheel no script de
     navegacao, que só considera esse scroll interno quando essa classe esta presente. */
  gap:clamp(12px,2.2vmin,22px); padding:clamp(16px,4vmin,72px) clamp(24px,7vw,108px);
  padding-bottom:clamp(64px,13vh,96px);
  overflow-y:hidden;
  --fit-scale:1;
  /* centraliza verticalmente por padrao -- numa tela bem maior que o conteudo (4K, por
     exemplo) o excedente de altura fica distribuido em vez de empurrado todo pra baixo do
     conteudo, que parecia vazio/quebrado. Slides cujo conteudo ja preenche o espaco (flex:1
     em algum filho, como os de demonstracao em video) nao mudam de aparencia -- justify-content
     so tem efeito quando sobra espaco livre pra distribuir. */
  justify-content:center;
  /* Troca de slide: crossfade + leve deslocamento vertical, com sentido (pra cima ao avancar,
     pra baixo ao voltar) dado por [data-dir] no .deck -- ver o script de navegacao. Nao usa
     "visibility" pra esconder (visibility nao interpola, so troca de uma vez): pointer-events
     cobre a parte de "nao e' clicavel enquanto invisivel", e opacity 0 + transform ja bastam
     pra sumir visualmente sem cortar a transicao de saida no meio. O scale() de cada estado e'
     multiplicado por --fit-scale (1 quando o conteudo ja cabe) -- e' a MESMA transform que ja
     fazia a transicao de entrada/saida, so' com o fator de ajuste de tela embutido, entao o
     "encolher pra caber" tambem anima suave junto com o crossfade em vez de saltar.  */
  opacity:0; transform:translate3d(0,3.4vh,0) scale(calc(.985 * var(--fit-scale))); pointer-events:none;
  transition:opacity .5s cubic-bezier(.16,1,.3,1), transform .5s cubic-bezier(.16,1,.3,1);
}
.deck[data-dir="back"] .slide{ transform:translate3d(0,-3.4vh,0) scale(calc(.985 * var(--fit-scale))); }
.slide.is-active{ opacity:1; transform:translate3d(0,0,0) scale(var(--fit-scale)); pointer-events:auto; z-index:2; }
/* slide que acabou de perder o foco: continua visivel um instante, saindo pelo lado OPOSTO de
   onde a proxima slide esta entrando -- e' o que da a sensacao de "passar a pagina" em vez de um
   corte seco. Some da lista de is-leaving por JS depois que a transicao termina (ver TRANSITION_MS). */
.slide.is-leaving{ opacity:0; transform:translate3d(0,-2.2vh,0) scale(calc(.99 * var(--fit-scale))); z-index:1; pointer-events:none; }
.deck[data-dir="back"] .slide.is-leaving{ transform:translate3d(0,2.2vh,0) scale(calc(.99 * var(--fit-scale))); }
/* excecao rara: --fit-scale ja bateu no piso (FIT_MIN_SCALE) e mesmo assim sobra conteudo de
   verdade -- unico caso em que a slide volta a ser scrollavel (ver o comentario grande em .slide
   acima e fitAllSlides() no script de navegacao). */
.slide.is-overflowing{ overflow-y:auto; }
/* revelacao em cascata dos blocos de 1o nivel de cada slide (eyebrow, headline, listas,
   diagrama...) -- cada um nasce um pouco abaixo e desfocado de opacidade, chegando com um
   atraso pequeno e crescente. So dispara na slide ATIVA; nas outras os filhos ficam parados em
   opacity:0 -- invisivel de qualquer forma, porque a propria slide ja esta em opacity:0. */
.slide > *{ opacity:0; transform:translateY(10px); }
/* slide que esta SAINDO (is-leaving, sem is-active) precisa dos filhos JA visiveis -- senao eles
   voltariam pro estado de partida (opacity:0) na hora, e a propria slide sumiria de golpe antes
   da transicao de opacity/transform dela (acima) terminar de rodar. Quem anima a saida e' a
   slide inteira, nao os filhos individualmente. */
.slide.is-leaving > *{ opacity:1; transform:none; animation:none; }
.slide.is-active > *{ animation:slideChildIn .6s cubic-bezier(.16,1,.3,1) both; }
.slide.is-active > *:nth-child(1){ animation-delay:.05s; }
.slide.is-active > *:nth-child(2){ animation-delay:.11s; }
.slide.is-active > *:nth-child(3){ animation-delay:.17s; }
.slide.is-active > *:nth-child(4){ animation-delay:.23s; }
.slide.is-active > *:nth-child(5){ animation-delay:.29s; }
.slide.is-active > *:nth-child(6){ animation-delay:.35s; }
.slide.is-active > *:nth-child(n+7){ animation-delay:.4s; }
@keyframes slideChildIn{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }
@media (prefers-reduced-motion:reduce){
  .slide, .slide.is-leaving, .deck[data-dir="back"] .slide, .deck[data-dir="back"] .slide.is-leaving{
    transition:opacity .28s ease; transform:none;
  }
  .slide > *{ opacity:1; transform:none; animation:none; }
  .slide.is-active > *{ animation:none; }
}

.eyebrow{
  font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.14em;
  font-size:clamp(.72rem,min(.85vw,1.5vh),.94rem); color:var(--teal); font-weight:500;
}
.headline{
  font-family:var(--font-display); font-weight:800; letter-spacing:.01em;
  /* teto bem mais alto que antes -- em tela grande/fullscreen (o caso de uso real de uma
     apresentacao) o texto precisa ler bem a distancia, nao so caber. min(vw,vh) continua
     encolhendo sozinho em janela pequena, entao o teto alto so tem efeito onde ha espaco. */
  font-size:clamp(1.5rem,min(3.6vw,5.6vh),3.6rem); line-height:1.05; color:var(--ink);
  max-width:26ch;
}
.lede{ font-size:clamp(.85rem,min(1.4vw,2.6vh),1.7rem); line-height:1.5; color:var(--ink); max-width:62ch; }
.lede.muted{ color:var(--muted); }
.body-copy{ max-width:70ch; }
.body-copy p + p{ margin-top:12px; }

.slide--title{ justify-content:center; gap:26px; }
.slide--title .eyebrow{ font-size:.82rem; }
.slide--title h1{
  font-family:var(--font-display); font-weight:900; letter-spacing:.01em;
  font-size:clamp(3.4rem,min(11vw,15vh),7.8rem); line-height:.92; color:var(--ink);
}
.slide--title .lede{ max-width:56ch; }
.meta-row{
  display:flex; flex-wrap:wrap; gap:10px 22px; font-family:var(--font-mono);
  font-size:clamp(.82rem,min(1vw,1.8vh),1.05rem); color:var(--muted); font-variant-numeric:tabular-nums;
}
.meta-row b{ color:var(--ink); font-weight:500; }

.tag-row{ display:flex; flex-wrap:wrap; gap:10px; margin-top:4px; }
.tag{
  font-family:var(--font-mono); font-size:clamp(.8rem,min(.95vw,1.7vh),1.05rem); padding:7px 13px;
  border-radius:3px; border:1px solid var(--line); background:var(--surface); color:var(--ink);
}

.kicker-row{ display:flex; align-items:baseline; justify-content:space-between; gap:14px; flex-wrap:wrap; }
.feat-badge{
  font-family:var(--font-mono); font-size:clamp(.68rem,min(.8vw,1.4vh),.86rem); letter-spacing:.04em;
  white-space:nowrap; color:var(--brick); border:1px solid var(--brick); background:var(--brick-soft);
  padding:3px 10px; border-radius:999px;
}
.feat-badge b{ font-weight:600; }

.slide--statement{ justify-content:center; align-items:flex-start; gap:14px; }
.statement{
  font-family:var(--font-display); font-weight:800;
  /* min() com termo em vh evita estourar a altura da viewport em telas mais baixas (ex.:
     1366x768) -- clamp(...,4.4vw,...) sozinho so reagia a LARGURA, entao um statement + lede
     longos podiam produzir scroll numa tela mais baixa mesmo com folga de largura sobrando. */
  font-size:clamp(1.7rem,min(4.4vw,6.4vh),4.2rem); line-height:1.08; max-width:24ch; color:var(--ink);
}
.statement em{ font-style:normal; color:var(--accent); }

/* stretch (nao "start") de proposito: quando uma coluna e' um .media-placeholder ou .callout,
   a caixa cresce pra acompanhar a altura da coluna irma em vez de ficar na altura minima --
   texto puro nao muda de aparencia (bloco cresce, o texto continua alinhado em cima). Isso sozinho
   NAO aumenta a altura da linha do grid (um grid-2 e' filho unico do .slide -- a altura da linha e'
   o maior conteudo ANTES do stretch; stretch so preenche o menor ate' esse tamanho, nunca cresce a
   linha). Por isso ".media-placeholder--fill" existe: usado nos poucos slides em que o grid-2 e' o
   UNICO bloco de conteudo (sem lede/lista antes dele) e o texto sozinho ficaria curto demais --
   ali um piso de altura alto faz a PROPRIA coluna de imagem ditar a altura da linha. Not aplicado
   por padrao a todo ".grid-2 > .media-placeholder" porque em slides com conteudo extra antes do
   grid-2 (ex.: um ul.list acima dele) isso soma altura demais e reintroduz overflow -- medido
   quebrando "Estresse o metaprojeto" ao tentar generalizar. */
.grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:34px; align-items:stretch; }
.grid-2 > .media-placeholder{ height:100%; }
.media-placeholder.media-placeholder--fill{ min-height:clamp(220px,42vh,460px); }

ul.list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:clamp(6px,1.6vh,14px); max-width:64ch; }
ul.list li{ position:relative; padding-left:22px; font-size:clamp(.85rem,min(1.6vw,2.3vh),1.4rem); line-height:1.45; }
ul.list li::before{ content:''; position:absolute; left:0; top:.6em; width:9px; height:2px; background:var(--teal); }
ul.list b{ color:var(--ink); font-weight:600; }
ul.list.tight{ max-width:76ch; }
ul.list.tight li{ font-size:clamp(.78rem,min(1.35vw,1.95vh),1.15rem); }

figure.diagram{ margin:0; display:flex; flex-direction:column; gap:10px; align-items:stretch; }
figure.diagram svg{ width:100%; height:auto; max-height:47vh; color:var(--muted); }
figure.diagram figcaption{ font-size:clamp(.85rem,min(1.15vw,2.1vh),1.2rem); color:var(--muted); max-width:70ch; }
.svg-accent{ color:var(--accent); }
.svg-teal{ color:var(--teal); }
.svg-amber{ color:var(--amber); }
.svg-brick{ color:var(--brick); }
.svg-ink{ color:var(--ink); }

.pipeline{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
.pipe-step{
  font-family:var(--font-mono); font-size:clamp(.82rem,min(1vw,1.8vh),1.08rem); background:var(--surface);
  border:1px solid var(--line); border-radius:5px; padding:10px 14px; color:var(--ink);
}
.pipe-arrow{ color:var(--teal); font-size:1.1rem; }

.callout{
  border-left:3px solid var(--amber); background:var(--amber-soft); border-radius:0 6px 6px 0;
  padding:14px 18px; max-width:68ch; display:flex; flex-direction:column; gap:6px;
}
.callout .k{ font-family:var(--font-mono); font-size:clamp(.68rem,min(.8vw,1.4vh),.88rem); letter-spacing:.12em; text-transform:uppercase; color:var(--amber); }
.callout p{ font-size:clamp(.92rem,min(1.3vw,2.3vh),1.3rem); line-height:1.45; }

.stat-row{ display:flex; flex-wrap:wrap; gap:10px; margin-top:6px; }
.stat-chip{
  border:1px solid var(--brick); color:var(--brick); font-family:var(--font-mono);
  font-size:clamp(.78rem,min(.95vw,1.7vh),1.02rem); padding:7px 12px; border-radius:999px;
  font-variant-numeric:tabular-nums; background:var(--brick-soft);
}

/* placeholder de midia (imagem/video) a providenciar depois -- deliberadamente TRACEJADO,
   pra nunca ser confundido com um card de conteudo terminado (.callout/.card/.axis-card
   usam borda solida) */
.media-placeholder{
  border:1.5px dashed var(--line); border-radius:8px; background:var(--surface);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:8px; padding:clamp(10px,2.4vh,22px); text-align:center; color:var(--muted);
  min-height:clamp(80px,16vh,128px);
}
.media-placeholder svg{ opacity:.55; color:var(--muted); }
.media-placeholder .tag{
  font-family:var(--font-mono); font-size:.68rem; letter-spacing:.12em; text-transform:uppercase;
  color:var(--muted); border:none; background:none; padding:0;
}
.media-placeholder .caption{ font-size:clamp(.86rem,min(1.1vw,2vh),1.12rem); max-width:36ch; line-height:1.4; font-style:italic; }
.media-placeholder .hint{
  font-family:var(--font-mono); font-size:clamp(.72rem,min(.9vw,1.6vh),.92rem); color:var(--muted);
  opacity:.75; word-break:break-all;
}
/* o mesmo bloco DEPOIS que o arquivo esperado foi encontrado em demos/: deixa de ser
   placeholder (borda tracejada, texto) e vira a propria midia -- borda solida, sem padding,
   fundo escuro pra letterbox de imagem/video nao brigar com o tema claro. */
.media-empty{ display:flex; flex-direction:column; align-items:center; gap:8px; }
/* OBRIGATORIO, e nao redundante com o atributo: [hidden]{display:none} vem da folha do
   USER-AGENT, entao o display:flex declarado logo acima (regra de autor) ganha dele e o
   .hidden=true do script de sondagem nao esconderia nada. Mesmo motivo da regra
   ".demo-stage video[hidden]" que ja existia mais abaixo -- aqui vale pros dois estados
   vazios e pra midia criada em runtime. */
.media-empty[hidden], .demo-empty[hidden], .media-placeholder.is-filled img[hidden],
.media-placeholder.is-filled video[hidden]{ display:none; }
.media-placeholder.is-filled{
  border:1px solid var(--line); background:#050708; padding:0; overflow:hidden; gap:0;
}
/* max-* (nao width/height 100%) de proposito pra IMAGEM: screenshot pequeno esticado ate' a
   caixa fica borrado -- assim ele fica no tamanho natural, centrado pelo flex do container, e
   so' encolhe quando nao couber. Video usa contain porque a fonte e' sempre grande. */
.media-placeholder.is-filled img{ max-width:100%; max-height:100%; display:block; }
.media-placeholder.is-filled video{ width:100%; height:100%; object-fit:contain; display:block; background:#000; }
.media-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }

/* slides de demonstracao em video -- UM video por tela (navegacao pelo proprio deck, igual a
   qualquer outro slide), nao um player+menu dentro de um slide so. .demo-stage dedica o MAXIMO
   de espaco disponivel ao video (flex:1 preenche tudo que sobra na coluna do slide), com o
   cabecalho reduzido de proposito pra sobrar mais altura. */
.slide--demo{ gap:12px; }
.slide--demo .headline{ font-size:1.3rem; max-width:none; }
.demo-stage{
  flex:1; min-height:0; position:relative; background:#050708; border:1px solid var(--line);
  border-radius:8px; overflow:hidden; display:flex; align-items:center; justify-content:center;
}
.demo-stage video{ width:100%; height:100%; object-fit:contain; display:block; background:#000; }
.demo-stage video[hidden]{ display:none; }
.demo-empty{ display:flex; flex-direction:column; align-items:center; gap:10px; padding:30px; text-align:center; }
.demo-empty svg{ opacity:.5; color:var(--muted); }
.demo-empty .tag{
  font-family:var(--font-mono); font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted);
}
.demo-empty .caption{ font-size:clamp(1.05rem,min(1.5vw,2.7vh),1.5rem); color:var(--ink); max-width:42ch; line-height:1.4; }
.demo-empty .hint{ font-size:clamp(.8rem,min(1vw,1.8vh),1.05rem); font-family:var(--font-mono); color:var(--muted); }

.hud{
  position:fixed; left:0; right:0; bottom:0; height:52px; z-index:10; display:flex; align-items:center;
  gap:18px; padding:0 18px; background:var(--surface); border-top:1px solid var(--line);
  font-family:var(--font-mono);
}
/* CURSO FIXO DA BARRA DE PROGRESSO -- a razao de esta coluna ter largura PROPRIA, declarada, e
   nao a largura do texto que ela mostra. O rotulo de secao (o .eyebrow da slide ativa, ver
   sectionOf()) varia de 14 a 54 caracteres entre as slides; enquanto a largura saia do conteudo,
   quem cedia espaco pra ele era a .hud-bar ao lado, o unico item que crescia. Medido em Chrome
   antes desta regra, nas 29 slides: o .hud-track ia de 757px a 1088px em 1920 e de 37px a 368px em
   1200 -- a MESMA fracao de progresso desenhava comprimentos diferentes, e a barra pulava de
   tamanho E de posicao a cada troca de secao (a borda esquerda dela tinha 7 posicoes distintas).
   Com base declarada, o track fica ancorado nas duas pontas: a esquerda porque a coluna nao varia,
   a direita porque tudo dali pra frente (contagem, dica, botoes) ja tinha largura constante.
   --hud-section-w e' publicada por fitHudSection() (script de navegacao) e vale a largura do rotulo
   MAIS LARGO do deck -- medida, nao chutada, e remedida quando a webfont chega ou a janela muda,
   pelo mesmo motivo que fitAllSlides() remede: a metrica do fallback nao e' a da fonte final. Sair
   da MAIOR medida, e nao de um numero fixo, e' o que da curso constante SEM truncar rotulo nenhum
   enquanto couberem todos (medido: zero truncagem de 1366px pra cima). O teto de 34vw e' quem corta
   quando nem o maior cabe, e os 460px so' valem se o JS nao rodar. Truncar aqui e' barato: este
   rotulo e' copia do .eyebrow que continua inteiro na propria slide, e o mapa (M) tambem o mostra
   integral -- a HUD e' pista redundante de orientacao, nao a portadora unica do dado; ainda assim
   render() espelha o texto completo no title=, pra o hover devolver o que a reticencia esconde.
   O min-width:0 e' redundante ENQUANTO existir o overflow:hidden logo abaixo (pela secao 4.5 do
   css-flexbox-1, um item flex com overflow != visible ja tem minimo automatico zero); esta
   declarado de proposito, pra o curso fixo nao depender de uma regra que so' esta ali por causa do
   text-overflow:ellipsis -- se o ellipsis virar mascara de fade e alguem apagar o overflow, o
   minimo de conteudo (== max-content, por causa do white-space:nowrap) voltaria a empurrar a
   coluna, e o bug reapareceria so' na faixa estreita, onde passaria despercebido. */
.hud-section{
  flex:0 1 min(var(--hud-section-w, 460px), 34vw); min-width:0;
  font-size:.76rem; color:var(--muted); text-transform:uppercase; letter-spacing:.08em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
/* flex-basis declarada (nao 0%) porque quando a HUD nao cabe o encolhimento e' repartido na
   proporcao das bases: com a base em 0% -- o default de "flex:1" -- a barra nao encolhia,
   batia direto no min-width e virava um toco de 19px enquanto a coluna do rotulo ao lado
   segurava a largura inteira dela. Os 200px sao o que a barra "pede" pra continuar legivel;
   acima disso ela cresce igual a antes, porque flex-grow continua 1. */

.hud-fill{ height:100%; background:var(--teal); width:3.7%; transition:width .25s ease; }

.hud-btn{
  flex:none; width:34px; height:34px; display:flex; align-items:center; justify-content:center;
  background:var(--surface-2); border:1px solid var(--line); border-radius:5px; cursor:pointer;
  transition:border-color .18s ease, color .18s ease, transform .18s ease, background-color .18s ease;

@media (prefers-reduced-motion:reduce){ .hud-btn{ transition:none; } .hud-btn:hover{ transform:none; } }

.overlay{
  position:fixed; inset:0; z-index:20; background:rgba(0,0,0,0); backdrop-filter:blur(0px);
  display:flex; align-items:center; justify-content:center; padding:40px;

.menu-panel{

  width:min(880px,92vw); max-height:82vh; overflow-y:auto; padding:26px 30px 32px;

.menu-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
.menu-head h2{ font-family:var(--font-display); font-weight:800; font-size:1.5rem; }
.menu-sections{ display:flex; flex-direction:column; gap:20px; }

  color:var(--teal); margin-bottom:8px;
}

/* os dois breakpoints de colapso (1 coluna) sao mais estreitos que o "980px" generico de
   antes -- aquele colapsava por LARGURA sozinha, e numa janela larga-porem-baixa (960x540, por

<script>
(function(){
  // Monta as <section class="slide"> dentro de #deck a partir de content.js, ANTES
  // dos dois scripts abaixo (navegacao, video), que continuam so fazendo
  // document.querySelectorAll('.slide') como sempre fizeram -- nenhuma mudanca neles
  // foi necessaria so por causa desta indirecao.
  var deck = document.getElementById('deck');
  var defs = window.PRESENTATION_SLIDES || [];
  var frag = document.createDocumentFragment();
  defs.forEach(function(def){
    var section = document.createElement('section');
    section.className = def.extraClass ? 'slide ' + def.extraClass : 'slide';
    section.setAttribute('data-title', def.title);
    section.innerHTML = def.html;
    frag.appendChild(section);
  });
  deck.appendChild(frag);
})();

<script>
(function(){
  var deck = document.getElementById('deck');
  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var total = slides.length;
  var hudSection = document.getElementById('hudSection');
  var hudFill = document.getElementById('hudFill');
  var hudCount = document.getElementById('hudCount');
  var overlay = document.getElementById('menuOverlay');
  var menuSections = document.getElementById('menuSections');
  var STORAGE_KEY = 'refatoracao-asa-deck-index';
  // tem que bater com a duracao da transicao CSS de ".slide"/".slide.is-leaving" (ver <style>)
  // -- e' o tempo que a slide anterior fica com a classe "is-leaving" antes de ser desligada de
  // vez (senao ela travaria em opacity:0 fora da tela, mas ainda participando do layout/animacao
  // de entrada na proxima vez que voltar a ficar ativa).
  var TRANSITION_MS = 520;
  var leavingTimeout = null;

  // Ajuste automatico de escala -- "ajuste correto ao tamanho da tela" nao e' so o clamp(vmin/vw/vh)
  // dos tamanhos de fonte (que ja reage a tela, mas so ate' o piso de cada clamp): quando o
  // conteudo natural de uma slide ainda estoura a altura disponivel (janela baixa, fonte do
  // sistema maior que o normal, zoom do navegador, etc.), a slide inteira ganha uma escala < 1
  // via a variavel CSS --fit-scale (ver <style>), do jeito que um visualizador de PDF encolhe a
  // pagina pra caber -- nunca precisa de scroll interno pra ver o resto do slide. Todo .slide e'
  // position:absolute;inset:0 e fica sempre no layout (so' opacity:0 quando inativo), entao dá
  // pra medir TODAS de uma vez, sem esperar cada uma virar ativa.
  var FIT_MIN_SCALE = 0.55;
  function fitAllSlides(){
    // duas passadas -- le TODAS as alturas primeiro, so' depois escreve -- pra nao entrelacar
    // leitura (forca layout) e escrita (invalida layout) slide a slide, que seria layout
    // thrashing com ~30 slides.
    var measurements = slides.map(function(s){
      return { slide: s, contentH: s.scrollHeight, availH: s.clientHeight };
    });
    measurements.forEach(function(m){
      var needsShrink = m.availH > 0 && m.contentH > m.availH;
      var rawScale = needsShrink ? m.availH / m.contentH : 1;
      var scale = needsShrink ? Math.max(FIT_MIN_SCALE, rawScale) : 1;
      m.slide.style.setProperty('--fit-scale', String(scale));
      // scale() nao muda scrollHeight/clientHeight (e' so' pintura) -- so' marca "ainda
      // scrollavel de verdade" quando nem o piso do encolhimento bastou pra cobrir o conteudo;
      // ver o comentario de ".slide"/".slide.is-overflowing" no <style>.
      m.slide.classList.toggle('is-overflowing', needsShrink && rawScale < FIT_MIN_SCALE);
    });
  }

  // Largura da coluna do rotulo de secao na HUD -- ver o comentario de ".hud-section" no <style>.
  // O curso da barra de progresso so' fica constante entre as slides se essa coluna tiver largura
  // propria; pra isso nao custar rotulo truncado, a largura e' a do rotulo MAIS LARGO do deck,
  // medida aqui (os rotulos vem do .eyebrow de cada slide, ou seja do content.js -- um numero
  // fixo no CSS envelheceria calado assim que uma secao fosse renomeada). Mesma disciplina de
  // fitAllSlides(): escreve TODAS as sondas primeiro, so' depois le -- uma passada de layout, nao
  // uma por rotulo.
  function fitHudSection(){
    var vistos = {};
    var probes = [];
    var caixa = document.createElement('div');
    caixa.setAttribute('aria-hidden', 'true');
    caixa.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden;pointer-events:none';
    var cs = window.getComputedStyle(hudSection);
    slides.forEach(function(s){
      var texto = sectionOf(s);
      if (!texto || vistos[texto]) return;
      vistos[texto] = true;
      var probe = document.createElement('span');
      probe.style.whiteSpace = 'nowrap';
      ['fontFamily','fontSize','fontWeight','fontStyle','letterSpacing','wordSpacing','textTransform']
        .forEach(function(prop){ probe.style[prop] = cs[prop]; });
      probe.textContent = texto;
      caixa.appendChild(probe);
      probes.push(probe);
    });
    if (!probes.length) return;
    document.body.appendChild(caixa);
    var maior = 0;
    probes.forEach(function(probe){ maior = Math.max(maior, probe.getBoundingClientRect().width); });
    document.body.removeChild(caixa);
    // +1 absorve o arredondamento sub-pixel entre a sonda e o proprio elemento (sem essa folga o
    // rotulo mais largo -- justamente o que define a coluna -- as vezes ganha reticencias por
    // uma fracao de pixel).
    if (maior > 0) document.documentElement.style.setProperty('--hud-section-w', Math.ceil(maior + 1) + 'px');
  }

  // A coluna do rotulo tem largura fixa (ver ".hud-section" no <style>), entao em tela estreita um
  // rotulo longo sai com reticencias -- ai, e SO' ai, o texto integral vai pro title=, pra o hover
  // devolver o que foi cortado. Sem a condicao, toda slide ganharia um tooltip repetindo o que ja
  // esta escrito ao lado. Chamada tanto no render() (rotulo mudou) quanto no resize (a MESMA
  // string pode passar a caber, ou deixar de caber, sem trocar de slide).
  function syncSectionTitle(){
    if (hudSection.scrollWidth > hudSection.clientWidth + 1) hudSection.title = hudSection.textContent;
    else hudSection.removeAttribute('title');
  }

  var fitResizeTimer = null;
  window.addEventListener('resize', function(){
    if (fitResizeTimer) clearTimeout(fitResizeTimer);
    fitResizeTimer = setTimeout(function(){ fitAllSlides(); fitHudSection(); syncSectionTitle(); }, 120);
  });
  // fontes web (Big Shoulders/Public Sans/IBM Plex Mono) carregam depois do primeiro layout --
  // a metrica muda ao trocar do fallback pra fonte de verdade, entao a medida inicial (antes
  // disso) pode ficar desatualizada pra cima ou pra baixo.
  if (window.document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ fitAllSlides(); fitHudSection(); syncSectionTitle(); });

  function pad(n){ return n < 10 ? '0' + n : '' + n; }

  function readStored(){
    try {
      var v = window.localStorage.getItem(STORAGE_KEY);
      var n = v === null ? 0 : parseInt(v, 10);
      if (isNaN(n) || n < 0 || n >= total) return 0;
      return n;
    } catch (e) { return 0; }
  }

  function writeStored(i){
    try { window.localStorage.setItem(STORAGE_KEY, String(i)); } catch (e) {}
  }

  var index = readStored();

  function sectionOf(slide){
    var eb = slide.querySelector('.eyebrow');
    return eb ? eb.textContent.trim() : '';
  }

  // play automatico ao ENTRAR num slide com video (demo-stage), pausa ao sair -- so' se aplica
  // quando o <video> ja tem "src" (atributo refletido tanto de src="..." no HTML quanto de um
  // video.src = "..." atribuido pelo script de probing abaixo); um <video hidden> sem fonte
  // ainda (placeholder ainda de pe) nao tem o que tocar. Reinicia do zero a cada entrada -- e'
  // o que "automatico ao entrar" pede, nao "continua de onde parou".
  function playSlideVideo(slide){
    var v = slide && slide.querySelector('video');
    if (!v || !v.getAttribute('src')) return;
    try { v.currentTime = 0; } catch (e) {}
    var p = v.play();
    if (p && typeof p.catch === 'function') p.catch(function(){});
  }
  function pauseSlideVideo(slide){
    var v = slide && slide.querySelector('video');
    if (v) v.pause();
  }

  function render(prevIndex, dir){
    if (leavingTimeout){ clearTimeout(leavingTimeout); leavingTimeout = null; }
    // limpa qualquer "is-leaving" que uma troca anterior ainda nao tenha terminado de
    // desligar (navegacao rapida, varias slides em sequencia antes da transicao acabar).
    slides.forEach(function(s){ s.classList.remove('is-leaving'); });

    // seta o sentido ANTES de tocar em classe de slide nenhuma, e forca o navegador a
    // "comitar" esse estado (offsetHeight le layout, o que obriga um recalculo de estilo) antes
    // de marcar a nova slide como ativa -- senao a transicao de entrada usaria o sentido
    // ANTIGO como ponto de partida (o browser so compara o ultimo estilo pintado contra o
    // estado final da mesma tarefa de script, e as duas mudancas aconteceriam juntas).
    if (dir) deck.setAttribute('data-dir', dir);
    if (prevIndex !== null && prevIndex !== index) void slides[index].offsetHeight;

    slides.forEach(function(s, i){
      if (i === index){ s.classList.add('is-active'); }
      else if (i === prevIndex){ s.classList.remove('is-active'); s.classList.add('is-leaving'); }
      else { s.classList.remove('is-active'); }
    });

    if (prevIndex !== null && prevIndex !== index) pauseSlideVideo(slides[prevIndex]);
    playSlideVideo(slides[index]);

    if (prevIndex !== null && prevIndex !== index){
      leavingTimeout = setTimeout(function(){
        if (slides[prevIndex]) slides[prevIndex].classList.remove('is-leaving');
        leavingTimeout = null;
      }, TRANSITION_MS);
    }

    hudSection.textContent = sectionOf(slides[index]);
    syncSectionTitle();
    hudFill.style.width = ((index + 1) / total * 100) + '%';
    hudCount.textContent = pad(index + 1) + ' / ' + pad(total);
    writeStored(index);
  }

  function go(i){
    var next = Math.max(0, Math.min(total - 1, i));
    if (next === index) return;
    var prev = index;
    var dir = next > index ? 'fwd' : 'back';
    index = next;
    render(prev, dir);
  }

  var closeMenuTimeout = null;

  function openMenu(){
    if (!menuSections.childElementCount) buildMenu();
    if (closeMenuTimeout){ clearTimeout(closeMenuTimeout); closeMenuTimeout = null; }
    overlay.hidden = false;
    // forca o navegador a comitar o estado "visivel porem sem is-open" (fundo transparente,
    // painel deslocado) antes de pedir a transicao pra "is-open" -- mesmo raciocinio do
    // offsetHeight em render(): sem isso as duas mudancas (tirar o hidden e ligar is-open)
    // colapsariam num unico frame e a abertura apareceria de golpe, sem transicao nenhuma.
    void overlay.offsetHeight;
    overlay.classList.add('is-open');
  }
  function closeMenu(){
    overlay.classList.remove('is-open');
    if (closeMenuTimeout) clearTimeout(closeMenuTimeout);
    closeMenuTimeout = setTimeout(function(){ overlay.hidden = true; closeMenuTimeout = null; }, 260);
  }

  function buildMenu(){
    var groups = [];
    var bySection = {};
    slides.forEach(function(s, i){
      var sec = sectionOf(s);
      if (!bySection[sec]) { bySection[sec] = []; groups.push(sec); }
      bySection[sec].push({ i: i, title: s.getAttribute('data-title') || sec });
    });
    groups.forEach(function(sec){
      var group = document.createElement('div');
      group.className = 'menu-group';
      var h = document.createElement('h3');
      h.textContent = sec;
      group.appendChild(h);
      var ul = document.createElement('ul');
      ul.className = 'menu-list';
      bySection[sec].forEach(function(item){
        var li = document.createElement('li');
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'menu-item';
        btn.innerHTML = '<span class="n">' + pad(item.i + 1) + '</span><span>' + item.title + '</span>';
        btn.addEventListener('click', function(){ go(item.i); closeMenu(); });
        li.appendChild(btn);
        ul.appendChild(li);
      });
      group.appendChild(ul);
      menuSections.appendChild(group);
    });
  }

  document.getElementById('btnPrev').addEventListener('click', function(){ go(index - 1); });
  document.getElementById('btnNext').addEventListener('click', function(){ go(index + 1); });
  document.getElementById('btnMenu').addEventListener('click', openMenu);
  document.getElementById('btnCloseMenu').addEventListener('click', closeMenu);
  overlay.addEventListener('click', function(e){ if (e.target === overlay) closeMenu(); });

  document.addEventListener('keydown', function(e){
    if (!overlay.hidden){
      if (e.key === 'Escape') { closeMenu(); e.preventDefault(); }
      return;
    }
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { go(index + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { go(index - 1); e.preventDefault(); }
    else if (e.key === 'Home') { go(0); e.preventDefault(); }
    else if (e.key === 'End') { go(total - 1); e.preventDefault(); }
    else if (e.key === 'm' || e.key === 'M') { openMenu(); e.preventDefault(); }
  });

  // scroll do mouse/trackpad passa slide -- respeitando o scroll INTERNO so' da rara slide
  // marcada ".is-overflowing" (o piso de --fit-scale nao bastou, ver fitAllSlides() acima): so'
  // pra essa e' que se espera a slide ativa encostar no topo (scroll pra cima) ou no fundo
  // (scroll pra baixo) do proprio conteudo antes de trocar de slide. Toda slide comum (a grande
  // maioria, ja cabendo na tela gracas ao --fit-scale) pula essa checagem por completo -- ela nem
  // e' um scroll container de verdade (overflow-y:hidden), entao QUALQUER wheel navega direto.
  //
  // Quantas slides um gesto de scroll avanca e' proporcional a QUANTO foi scrollado, nao a UM
  // cooldown de tempo fixo por evento -- uma primeira versao tentava adivinhar "rapido" pelo
  // intervalo entre eventos, mas o PRIMEIRO evento de qualquer gesto nao tem historico nenhum pra
  // comparar (intervalo desconhecido), entao sempre nascia com o cooldown mais LENTO -- e como
  // esse cooldown inicial e' mais longo que uma rajada inteira de scroll rapido (testado: 10
  // "cliques" de roda em ~400ms so' avancavam 1 slide, travados pelo cooldown do PRIMEIRO evento),
  // um scroll rapido nunca chegava a se provar rapido. O acumulador abaixo nao tem esse problema
  // porque nao depende de historico nenhum: cada evento soma sua propria magnitude
  // (Math.abs(deltaY)) a um saldo, e cada vez que o saldo cruza WHEEL_STEP dispara uma troca de
  // slide -- um "clique" isolado de roda de mouse (deltaY tipicamente 90-140 num evento so' ja
  // cruza o piso sozinho -> uma troca, na hora, igual a sempre; girar a roda com forca manda
  // varios desses eventos em sequencia rapida, cada um cruzando o piso de novo -> varias trocas em
  // sequencia, sem cooldown nenhum brecando. Trackpad manda muitos eventos PEQUENOS (deltaY baixo)
  // pra um so' gesto -- o saldo acumula entre eles ate' cruzar o piso, entao um toque leve nao
  // dispara nada e um "fling" de verdade (soma alta num intervalo curto) dispara varias trocas,
  // igual ao mouse.
  var WHEEL_THRESHOLD = 10;   // ignora ruido (deltaY minusculo -- cauda de inercia de trackpad)
  var WHEEL_STEP = 90;        // "custo" em deltaY de UMA troca de slide
  var WHEEL_RESET_GAP_MS = 400; // gesto novo (pausa longa antes): zera saldo de um scroll velho
  var WHEEL_MAX_STEPS_PER_EVENT = 4; // trava contra um deltaY anomalo enorme num unico evento
  var wheelAccum = 0;
  var lastWheelTime = 0;

  deck.addEventListener('wheel', function(e){
    if (!overlay.hidden) return;
    if (Math.abs(e.deltaY) < WHEEL_THRESHOLD) return;

    var active = slides[index];
    var scrollable = active.classList.contains('is-overflowing');
    var atBottom = !scrollable || Math.ceil(active.scrollTop + active.clientHeight) >= active.scrollHeight;
    var atTop = !scrollable || active.scrollTop <= 0;
    if (e.deltaY > 0 && !atBottom) return;
    if (e.deltaY < 0 && !atTop) return;

    e.preventDefault();

    var now = e.timeStamp || Date.now();
    var dir = e.deltaY > 0 ? 1 : -1;
    if (!lastWheelTime || (now - lastWheelTime) > WHEEL_RESET_GAP_MS) wheelAccum = 0;
    lastWheelTime = now;
    // inverteu o sentido no meio do gesto (ex.: hesitou e voltou) -- o saldo acumulado era
    // "credito" pro sentido ANTERIOR, nao serve mais.
    if (wheelAccum !== 0 && (wheelAccum > 0) !== (dir > 0)) wheelAccum = 0;
    wheelAccum += dir * Math.abs(e.deltaY);

    var steps = 0;
    while (Math.abs(wheelAccum) >= WHEEL_STEP && steps < WHEEL_MAX_STEPS_PER_EVENT) {
      go(index + dir);
      wheelAccum -= dir * WHEEL_STEP;
      steps++;
    }
  }, { passive: false });

  fitAllSlides();
  fitHudSection();
  render(null, null);
})();
</script>

<script>
(function(){
  // SONDAGEM DE MIDIA POR NOME DE ARQUIVO -- o mecanismo que faz "soltar o arquivo em
  // docs/presentation/demos/ com o nome esperado" ser tudo o que e' preciso pra midia aparecer
  // no slide: nenhuma edicao de HTML/JS, nenhum passo de build.
  //
  // Todo slot de midia do deck (os slides de demonstracao em video, ".demo-stage", e os
  // placeholders de imagem/video no meio do conteudo, ".media-placeholder") declara em
  // content.js um data-media="demos/<nome>" SEM extensao, mais um data-media-kind que diz qual
  // formato e' o esperado -- e' so' isso que decide a ORDEM de sondagem, nunca o que e'
  // aceito: os dois tipos sao sempre tentados, entao trocar um video por um print (ou o
  // contrario) num slot qualquer nao exige tocar em codigo nenhum.
  //
  // Enquanto nenhum arquivo casar, o slot fica no placeholder que ja vem no HTML -- que
  // mostra, ele mesmo, o nome esperado. Ver docs/presentation/demos/README.md pra tabela.
  var EXTS = {
    video: ['mp4', 'webm', 'mov'],
    image: ['png', 'jpg', 'jpeg', 'webp', 'gif', 'svg']
  };

  function sonda(kind, src, achou, faltou){
    if (kind === 'video'){
      var v = document.createElement('video');
      v.preload = 'metadata';
      v.onloadedmetadata = function(){ achou(); };
      v.onerror = function(){ faltou(); };
      v.src = src;
    } else {
      var img = new Image();
      img.onload = function(){ achou(); };
      img.onerror = function(){ faltou(); };
      img.src = src;
    }
  }

  Array.prototype.forEach.call(document.querySelectorAll('[data-media]'), function(stage){
    var base = stage.getAttribute('data-media');
    var pref = stage.getAttribute('data-media-kind') === 'image' ? 'image' : 'video';
    var outro = pref === 'image' ? 'video' : 'image';

    // a lista de candidatos e' o tipo preferido primeiro, o outro logo em seguida
    var cand = [];
    EXTS[pref].forEach(function(e){ cand.push({ kind: pref, src: base + '.' + e }); });
    EXTS[outro].forEach(function(e){ cand.push({ kind: outro, src: base + '.' + e }); });

    var vazio = stage.querySelector('.demo-empty, .media-empty');

    function mostra(kind, src){
      if (vazio) vazio.hidden = true;
      var el = stage.querySelector(kind === 'video' ? 'video' : 'img');
      if (!el){
        el = document.createElement(kind === 'video' ? 'video' : 'img');
        if (kind === 'video'){ el.controls = true; el.playsInline = true; }
        else { el.alt = ''; }
        stage.appendChild(el);
      }
      el.hidden = false;
      el.src = src;
      if (kind === 'video'){
        el.load();
        // caso raro mas real: a sessao volta direto neste slide (posicao restaurada do
        // localStorage), entao ele ja esta "is-active" no instante em que a sondagem acima
        // termina de resolver -- sem isso, o video so tocaria automatico na PROXIMA vez que o
        // slide fosse (re)ativado, nao nesta primeira entrada.
        var slide = stage.closest('.slide');
        if (slide && slide.classList.contains('is-active')){
          try { el.currentTime = 0; } catch (e) {}
          var pr = el.play();
          if (pr && typeof pr.catch === 'function') pr.catch(function(){});
        }
      }
      stage.classList.add('is-filled');
    }

    function tenta(i){
      if (i >= cand.length){
        // nenhum arquivo com esse nome: o placeholder fica de pe, anunciando o nome esperado
        var v = stage.querySelector('video');
        if (v) v.hidden = true;
        if (vazio) vazio.hidden = false;
        return;
      }
      sonda(cand[i].kind, cand[i].src,
            function(){ mostra(cand[i].kind, cand[i].src); },
            function(){ tenta(i + 1); });
    }

    tenta(0);
  });
})();
</script>
