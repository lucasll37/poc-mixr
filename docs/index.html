const CAT_NW = 128,
  CAT_NH = 24,
  CAT_ROW = 30,
  CAT_COL = 144,
  CAT_GAP = 30,
  CAT_PAD = 14,
  CAT_TITLE_H = 20;
function layoutCategory(cat) {
  let rowCursor = 0;
  const nodes = [];
  cat.forests.forEach(root => {
    const place = (n, depth) => {
      const kids = n.children || [];
      if (!kids.length) {
        nodes.push({
          ...n,
          lx: depth * CAT_COL,
          ly: rowCursor * CAT_ROW,
          depth
        });
        rowCursor += 1;
      } else {
        kids.forEach(k => place(k, depth + 1));
        const f = nodes.find(m => m.id === kids[0].id),
          l = nodes.find(m => m.id === kids[kids.length - 1].id);
        nodes.push({
          ...n,
          lx: depth * CAT_COL,
          ly: (f.ly + l.ly) / 2,
          depth
        });
      }
    };
    place(root, 0);
    rowCursor += 1; // linha em branco entre florestas da mesma categoria
  });
  const maxDepth = nodes.reduce((m, n) => Math.max(m, n.depth), 0);
  const width = maxDepth * CAT_COL + CAT_NW + CAT_PAD * 2;
  const height = (rowCursor - 1) * CAT_ROW + CAT_NH + CAT_TITLE_H + CAT_PAD * 2;
  return {
    nodes,
    width,
    height
  };
}
function packCategories(categories, targetWidth) {
  let x = 0,
    y = 0,
    shelfH = 0;
  const placed = categories.map(cat => {
    const laid = layoutCategory(cat);
    if (x > 0 && x + laid.width > targetWidth) {
      x = 0;
      y += shelfH + CAT_GAP;
      shelfH = 0;
    }
    const ox = x,
      oy = y;
    const nodes = laid.nodes.map(n => ({
      ...n,
      x: n.lx + ox + CAT_PAD,
      y: n.ly + oy + CAT_PAD + CAT_TITLE_H + CAT_NH / 2
    }));
    x += laid.width + CAT_GAP;
    shelfH = Math.max(shelfH, laid.height);
    return {
      title: cat.title,
      ox,
      oy,
      width: laid.width,
      height: laid.height,
      nodes
    };
  });
  const totalW = Math.max(CAT_GAP, ...placed.map(c => c.ox + c.width)) + CAT_GAP;
  const totalH = y + shelfH + CAT_GAP;
  return {
    placed,
    totalW,
    totalH
  };
}
